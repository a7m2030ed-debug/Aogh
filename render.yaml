# Render Blueprint — creates the API and its Postgres together and wires
# them to each other, so deploying is "connect this repo and apply"
# rather than a sequence of manual steps.
#
# Render reads this file from the repository root. See DEPLOY.md.
#
# Deliberately left out: a `plan:` for either resource. Pick the tier in
# Render's UI when you apply — hard-coding a tier here would silently
# choose what you pay, and their tier names change.

databases:
  - name: qitaati-db
    databaseName: carparts
    user: carparts
    # Frankfurt is Render's closest region to Saudi Arabia; keep the
    # database and the service in the same one or every query pays a
    # cross-region round trip.
    region: frankfurt

services:
  - type: web
    name: qitaati-api
    runtime: docker
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The container applies migrations and loads the catalog on boot
    # (backend/docker-entrypoint.sh), so a fresh database needs no
    # separate setup step.
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qitaati-db
          property: connectionString
      # Generated by Render and never seen by anyone — the app refuses to
      # boot in production without a real one.
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

      # ── Providers ──────────────────────────────────────────────────
      # Left on their safe defaults so the first deploy works with no
      # accounts at all: login uses the fixed code 0000, and push writes
      # in-app notifications without waking devices. Fill these in from
      # the Render dashboard as each account comes through — see
      # backend/.env.example for what each one is.
      - key: OTP_PROVIDER
        value: mock
      - key: TAQNYAT_TOKEN
        sync: false
      - key: TAQNYAT_SENDER
        sync: false

      - key: PUSH_PROVIDER
        value: none
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false

      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
