<style>
/* Layout: one drop zone → the report pages stacked at full width, actions in a sticky bar. Report paper keeps the Meena deck look in both themes. */
:root{
  --bg:#F5F4F9; --panel:#FFFFFF; --panel-2:#FAF9FD; --text:#231F3D; --dim:#6F6B86; --line:#E4E1EF;
  --field:#FFFFFF; --field-line:#DAD6EA; --ink:#2D2460; --ink-2:#3B3175; --accent:#6E5FA8; --accent-soft:#EDEAF6;
  --warn:#9A5B12; --warn-bg:#FBF0DE; --on-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(45,36,96,.06),0 8px 24px rgba(45,36,96,.08);
  --f-ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-doc:Arial,Arimo,"Liberation Sans",Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15132A; --panel:#1E1B38; --panel-2:#252145; --text:#ECE9F8; --dim:#A7A1C4; --line:#332E5C;
    --field:#17152E; --field-line:#3A3462; --accent:#9D8FD6; --accent-soft:#2A2550; --warn:#E8B463; --warn-bg:#3A2E14;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15132A; --panel:#1E1B38; --panel-2:#252145; --text:#ECE9F8; --dim:#A7A1C4; --line:#332E5C;
  --field:#17152E; --field-line:#3A3462; --accent:#9D8FD6; --accent-soft:#2A2550; --warn:#E8B463; --warn-bg:#3A2E14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);direction:rtl;font-size:14px}
button{font:inherit;color:inherit}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin-inline:auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .lg{background:#FFFFFF;border-radius:7px;padding:5px 8px;display:flex;border:1px solid var(--line)}
.brand .lg img{height:20px;width:auto;display:block}
.brand b{display:block;font-size:15px;font-weight:700}
.brand span{display:block;font-size:12px;color:var(--dim);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--field-line);background:var(--field);border-radius:9px;
  padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover{background:var(--ink-2);color:var(--on-ink)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{max-width:1180px;margin-inline:auto;display:grid;gap:16px;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.drop{background:var(--panel);border:1.5px dashed var(--field-line);border-radius:16px;padding:56px 22px;text-align:center;cursor:pointer;
  box-shadow:var(--shadow);transition:border-color .15s,background .15s;max-width:820px;width:100%;margin-inline:auto}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{width:56px;height:56px;margin:0 auto 14px;border-radius:14px;background:var(--ink);display:grid;place-items:center}
.drop .ic svg{width:28px;height:28px;stroke:#FFFFFF;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.drop h2{margin:0 0 6px;font-size:19px;font-weight:700;text-wrap:balance}
.drop p{margin:0 auto;max-width:46ch;font-size:13.5px;line-height:1.8;color:var(--dim)}
.drop .err{margin-top:14px;display:inline-block;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.drop .spin{width:38px;height:38px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--field-line);border-top-color:var(--accent);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.drop .spin{animation-duration:2.6s}}

.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status .per{font-size:13px;font-weight:600;color:var(--text);margin-inline-end:6px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);direction:ltr;font-variant-numeric:tabular-nums}
.chip.warn{background:var(--warn-bg);color:var(--warn);direction:rtl}

.pages{display:grid;gap:18px}
.frame{position:relative;width:100%;aspect-ratio:960/551;max-width:100%;overflow:hidden;border-radius:4px;direction:ltr;
  box-shadow:0 2px 6px rgba(45,36,96,.14),0 18px 50px rgba(45,36,96,.16);background:#FFFFFF}
.paper{position:absolute;top:0;left:0;width:960px;height:551px;background:#FFFFFF;transform-origin:0 0;font-family:var(--f-doc);
  color:#231F3D;overflow:hidden}
.paper .e{position:absolute}
.paper .tx{display:flex;align-items:center;white-space:nowrap;overflow:hidden;line-height:1.15}
.paper .tx span{overflow:hidden;text-overflow:ellipsis}
.paper .tr{position:absolute;left:0;display:flex}
.paper .td{display:flex;align-items:center;overflow:hidden;white-space:nowrap;padding:0 10.56px}
.paper .td span{overflow:hidden;text-overflow:ellipsis}
.paper .bb{position:absolute;left:0;right:0;bottom:0;height:.75px;background:#E8E5F2}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;
  max-width:min(560px,calc(100% - 32px));background:var(--ink);color:#FFFFFF;border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.7;
  box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center}
.shade{position:fixed;inset:0;z-index:60;background:rgba(21,19,42,.72);overflow:auto;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:1000px;margin:0 auto;background:var(--panel);color:var(--text);border-radius:16px;padding:16px;display:grid;gap:12px}
.sheet .row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.sheet h3{margin:0;font-size:16px}
.sheet p{margin:4px 0 0;font-size:13px;line-height:1.7;color:var(--dim)}
.sheet img{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.18);-webkit-touch-callout:default}
</style>

<script>
/* Mammogram offer report — pure logic: parse MIS exports, aggregate, lay out slides, export PPTX. */
var MC = (function () {
  "use strict";

  var OFFER_START = Date.UTC(2026, 9, 10); // Day 1 of the October breast cancer offer: Sat 10 Oct 2026
  var TITLE = "October Breast Cancer Offer — Mammogram Sales";
  var ORG = "Meena Primary Health Care Centers";
  var DAY = 86400000;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var WD = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var C = {
    navy: "2D2460", mid: "6E5FA8", lav: "C6BEE6", card: "F4F2FA", ink: "231F3D", ink2: "2C2A3D",
    muted: "8A85A3", label: "7C7796", track: "E7E3F4", alt: "FAF9FD", border: "E8E5F2", foot: "EDEBF4", white: "FFFFFF"
  };

  /* ---------------- parsing ---------------- */
  function parseDate(s) {
    var m = String(s || "").match(/(\d{1,2})[-\s\/]([A-Za-z]{3})[A-Za-z]*[-\s\/](\d{4})/);
    if (!m) return null;
    var mi = MON.map(function (x) { return x.toLowerCase(); }).indexOf(m[2].toLowerCase());
    if (mi < 0) return null;
    return Date.UTC(+m[3], mi, +m[1]);
  }
  function cleanBranch(h) {
    var s = String(h || "").trim().replace(/^Meena\s*(Center|Centre)\s*[-–]?\s*/i, "").trim();
    return s || String(h || "").trim();
  }
  function txt(v) { return v === null || v === undefined ? "" : String(v).trim(); }

  /* aoa: array of rows (arrays). Returns {branch, from, to, rows:[{date, provider, dept, service, count}]} or {error} */
  function parseAoA(aoa, fileName) {
    var meta = "", hdrIdx = -1, i, j;
    for (i = 0; i < Math.min(aoa.length, 25); i++) {
      var row = aoa[i] || [];
      for (j = 0; j < row.length; j++) {
        var v = txt(row[j]);
        if (!meta && /From\s*Date\s*:/i.test(v)) meta = v;
      }
      if (hdrIdx < 0 && row.some(function (c) { return /^(Test\/ProcedureName|Provider|MRNO)$/i.test(txt(c)); })) hdrIdx = i;
    }
    if (hdrIdx < 0) return { error: "no_header" };
    var hdr = (aoa[hdrIdx] || []).map(txt);
    function col(re) { for (var k = 0; k < hdr.length; k++) if (re.test(hdr[k])) return k; return -1; }
    var cService = col(/^Test\/ProcedureName$|procedure|service/i);
    var cProv = col(/^Provider$/i);
    var cDept = col(/^Department$/i);
    var cCount = col(/^Count$/i);
    if (cService < 0) return { error: "no_service" };

    var from = null, to = null, branch = "";
    if (meta) {
      from = parseDate((meta.match(/From\s*Date\s*:\s*([^,]+)/i) || [])[1]);
      to = parseDate((meta.match(/To\s*Date\s*:\s*([^,]+)/i) || [])[1]);
      var hm = meta.match(/Hospital\s*:\s*([^,]+)\s*$/i) || meta.match(/Hospital\s*:\s*([^,]+)/i);
      if (hm) branch = cleanBranch(hm[1]);
    }
    if (!branch) branch = String(fileName || "Branch").replace(/\.[^.]+$/, "");

    var rows = [], cur = null;
    for (i = hdrIdx + 1; i < aoa.length; i++) {
      var r = aoa[i] || [], a = txt(r[0]);
      if (/^Bill\s*Date\s*:/i.test(a)) { cur = parseDate(a); continue; }
      if (/^Category\s*:/i.test(a)) continue;
      var svc = txt(r[cService]);
      if (!svc) continue;
      var cnt = cCount >= 0 ? parseFloat(txt(r[cCount])) : 1;
      if (!isFinite(cnt) || cnt <= 0) cnt = 1;
      rows.push({
        date: cur, service: svc, count: cnt,
        provider: cProv >= 0 ? txt(r[cProv]).replace(/\s+/g, " ") : "",
        dept: cDept >= 0 ? txt(r[cDept]) : ""
      });
    }
    if (from === null || to === null) {
      var ds = rows.map(function (x) { return x.date; }).filter(function (d) { return d !== null; });
      if (ds.length) { from = from === null ? Math.min.apply(null, ds) : from; to = to === null ? Math.max.apply(null, ds) : to; }
    }
    return { branch: branch, from: from, to: to, rows: rows };
  }

  /* ---------------- aggregation ---------------- */
  function aggregate(files) {
    var ok = files.filter(function (f) { return !f.error; });
    var A = { total: 0, byBranch: {}, byDay: {}, byDoc: {}, depts: {}, from: null, to: null, mixed: false, nFiles: ok.length };
    var ranges = {};
    ok.forEach(function (f) {
      if (!(f.branch in A.byBranch)) A.byBranch[f.branch] = 0;
      if (f.from !== null) A.from = A.from === null ? f.from : Math.min(A.from, f.from);
      if (f.to !== null) A.to = A.to === null ? f.to : Math.max(A.to, f.to);
      ranges[f.from + "|" + f.to] = 1;
      f.rows.forEach(function (r) {
        A.total += r.count;
        A.byBranch[f.branch] += r.count;
        if (r.date !== null) A.byDay[r.date] = (A.byDay[r.date] || 0) + r.count;
        var p = r.provider || "Unassigned";
        var d = A.byDoc[p] || (A.byDoc[p] = { name: p, n: 0, branches: {} });
        d.n += r.count; d.branches[f.branch] = 1;
        if (r.dept) A.depts[r.dept] = 1;
      });
    });
    A.mixed = Object.keys(ranges).length > 1;
    A.branches = Object.keys(A.byBranch).map(function (b) { return { name: b, n: A.byBranch[b] }; })
      .sort(function (x, y) { return y.n - x.n || x.name.localeCompare(y.name); });
    A.docs = Object.keys(A.byDoc).map(function (k) {
      var d = A.byDoc[k];
      var bs = Object.keys(d.branches).sort();
      return { name: d.name, n: d.n, branch: bs.length > 2 ? bs[0] + " +" + (bs.length - 1) : bs.join(" / ") };
    }).sort(function (x, y) { return y.n - x.n || x.name.localeCompare(y.name); });
    A.daily = A.from !== null && A.from === A.to;
    A.nDays = A.from !== null ? Math.round((A.to - A.from) / DAY) + 1 : 0;
    return A;
  }

  /* ---------------- formatting ---------------- */
  function dd(t) { return new Date(t).getUTCDate(); }
  function mon(t) { return MON[new Date(t).getUTCMonth()]; }
  function yr(t) { return new Date(t).getUTCFullYear(); }
  function dayNo(t) { return Math.round((t - OFFER_START) / DAY) + 1; }
  function badge(A) {
    if (A.from === null) return "";
    var f = A.from, t = A.to;
    if (f === t) return dd(f) + " " + mon(f).toUpperCase() + " " + yr(f);
    if (yr(f) !== yr(t)) return dd(f) + " " + mon(f).toUpperCase() + " " + yr(f) + " – " + dd(t) + " " + mon(t).toUpperCase() + " " + yr(t);
    if (mon(f) !== mon(t)) return dd(f) + " " + mon(f).toUpperCase() + " – " + dd(t) + " " + mon(t).toUpperCase() + " " + yr(t);
    return dd(f) + "–" + dd(t) + " " + mon(t).toUpperCase() + " " + yr(t);
  }
  function shortDay(t) { return WD[new Date(t).getUTCDay()].slice(0, 3) + " " + dd(t) + " " + mon(t); }
  function iso(t) { var d = new Date(t); return d.getUTCFullYear() + "-" + ("0" + (d.getUTCMonth() + 1)).slice(-2) + "-" + ("0" + d.getUTCDate()).slice(-2); }
  function fileBase(A) {
    var b = "Breast_Cancer_Offer_Mammogram_Sales";
    if (A.from === null) return b;
    return A.daily ? b + "_" + iso(A.from) : b + "_" + iso(A.from) + "_to_" + iso(A.to);
  }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function fit(text, size, width, min) {

    S.push({ t: "rect", x: 785.26, y: 20.16, w: 153.6, h: 40.32, fill: C.mid, r: 6.72 });
    S.push({ t: "text", x: 785.26, y: 20.16, w: 153.6, h: 40.32, text: bdg, size: fit(bdg, 14.4, 140, 10), bold: true, color: C.white, align: "center", spc: 1 });
  }
  function footer(S, page, bdg) {
    S.push({ t: "line", x: 0, y: 526.07, w: W, color: C.foot });
    S.push({ t: "text", x: 21.12, y: 529.91, w: 672, h: 17.28, text: ORG + " · Mammogram Offer Sales · " + bdg, size: 10.1, color: C.muted });
    S.push({ t: "text", x: 672, y: 529.91, w: 266.88, h: 17.28, text: "CONFIDENTIAL · Page " + page, size: 10.1, color: C.muted, align: "right" });
  }
  function kpi(S, i, label, value, sub, big) {
    var x = [21.12, 253.92, 486.71, 719.5][i], tx = x + 13.44, vs = big ? 28.8 : 20.2;
    S.push({ t: "rect", x: x, y: 96, w: 219.36, h: 86.4, fill: C.card, r: 8.64 });
    S.push({ t: "text", x: tx, y: 105.6, w: 192.48, h: 15.36, text: label, size: 9.6, bold: true, color: C.label, spc: 1 });
    S.push({ t: "text", x: tx, y: 122.88, w: 192.48, h: 34.56, text: value, size: fit(value, vs, 192, 12), bold: true, color: C.navy });
    S.push({ t: "text", x: tx, y: 159.36, w: 192.48, h: 15.36, text: sub, size: fit(sub, 10.6, 192, 8), color: C.muted });

  function section(S, n, title, y) {
    S.push({ t: "ellipse", x: 21.12, y: y + 3.84, w: 21.12, h: 21.12, fill: C.navy });
    S.push({ t: "text", x: 21.12, y: y + 3.84, w: 21.12, h: 21.12, text: String(n), size: 11, bold: true, color: C.white, align: "center" });
    S.push({ t: "text", x: 51.84, y: y, w: 700, h: 28.8, text: title, size: 15.4, bold: true, color: C.navy });
  }
  function hcell(text, align) { return { text: text, size: 12, bold: true, color: C.white, fill: C.navy, align: align || "center" }; }

  /* split ranked items into table pages; the Total row sits on the last page */
  function paginate(items, availFirst, availNext) {
    var pages = [], i = 0, first = true;
    for (;;) {
      var avail = first ? availFirst : availNext, cap = Math.floor(avail / MINROW) - 1, rem = items.length - i;
      if (rem + 1 <= cap) { pages.push({ start: i, items: items.slice(i), total: true, avail: avail }); break; }
      var take = rem <= cap ? rem - 1 : cap;

  }
  function rankedTable(S, y, pg, all, opts) {
    var cols = opts.cols, nRows = pg.items.length + (pg.total ? 1 : 0) + 1;
    var rh = Math.min(ROWH, Math.floor(pg.avail / nRows * 100) / 100);
    var fs = rh < 26 ? 11.5 : 12.5;
    var mx = Math.max.apply(null, all.map(function (x) { return x.n; }).concat([1]));
    var rows = [];
    var h = [hcell("#"), hcell(opts.head, "left")];
    if (opts.extra) h.push(hcell(opts.extra, "left"));
    h.push(hcell("Mammograms"), hcell("Distribution", "left"));
    rows.push({ h: rh, cells: h });
    var barX = LM + cols.slice(0, -1).reduce(function (a, b) { return a + b; }, 0) + PAD;
    var barW = cols[cols.length - 1] - 2 * PAD, barH = Math.min(12.48, Math.round(rh * 0.41 * 100) / 100);
    var bars = [];
    pg.items.forEach(function (it, k) {
      var gi = pg.start + k, fill = gi % 2 === 0 ? C.white : C.alt;
      var cells = [
        { text: String(gi + 1), size: fs, color: C.ink2, fill: fill, align: "center" },
        { text: it.name, size: fs, bold: true, color: C.ink, fill: fill, align: "left" }
      ];
      if (opts.extra) cells.push({ text: it.branch, size: fs, color: C.ink2, fill: fill, align: "left" });
      cells.push({ text: String(it.n), size: fs, bold: true, color: C.ink, fill: fill, align: "center" });
      cells.push({ text: "", size: fs, color: C.ink, fill: fill, align: "left" });
      rows.push({ h: rh, cells: cells, bb: true });
      var by = y + rh * (k + 1) + (rh - barH) / 2;
      bars.push({ t: "rect", x: barX, y: by, w: barW, h: barH, fill: C.track, r: barH / 2 });
      if (it.n > 0) bars.push({ t: "rect", x: barX, y: by, w: Math.max(barH, barW * it.n / mx), h: barH, fill: C.mid, r: barH / 2 });
    });
    if (pg.total) {
      var tot = all.reduce(function (a, b) { return a + b.n; }, 0);
      var tc = [{ text: "", size: fs, color: C.white, fill: C.navy }, { text: "Total", size: fs, bold: true, color: C.white, fill: C.navy, align: "left" }];
      if (opts.extra) tc.push({ text: "", size: fs, color: C.white, fill: C.navy });
      tc.push({ text: String(tot), size: fs, bold: true, color: C.white, fill: C.navy, align: "center" });
      tc.push({ text: "", size: fs, color: C.white, fill: C.navy });
      rows.push({ h: rh, cells: tc });
    }
    S.push({ t: "table", x: LM, y: y, cols: cols, rows: rows });
    bars.forEach(function (b) { S.push(b); });
  }

  function buildModel(A) {

    var d1 = A.from !== null ? dayNo(A.from) : 0, d2 = A.to !== null ? dayNo(A.to) : 0;
    var sub1;

    var top = withSales[0];

      var ties = withSales.filter(function (b) { return b.n === top.n; });
      var tv = ties.length === 1 ? top.name : ties.length === 2 ? ties[0].name + " / " + ties[1].name : top.name + " +" + (ties.length - 1);
      kpi(S, 2, "TOP BRANCH", tv, plural(top.n, "mammogram") + (ties.length > 1 ? " each" : ""), false);
    } else kpi(S, 2, "TOP BRANCH", "—", "no sales", false);
    var days = Object.keys(A.byDay).map(Number);
    if (!A.daily && days.length) {
      var peak = days.sort(function (a, b) { return A.byDay[b] - A.byDay[a] || a - b; })[0];
      kpi(S, 3, "PEAK DAY", shortDay(peak), plural(A.byDay[peak], "mammogram") + " · " + Math.round(A.byDay[peak] / Math.max(A.total, 1) * 100) + "% of total", false);
    } else if (A.docs.length) {
      var td = A.docs[0], dties = A.docs.filter(function (d) { return d.n === td.n; }).length;
      kpi(S, 3, "TOP PHYSICIAN", td.name, plural(td.n, "mammogram") + (dties > 1 ? " · tied with " + (dties - 1) : " · " + td.branch), false);
    } else kpi(S, 3, "TOP PHYSICIAN", "—", "no sales", false);

    var bCols = [40.32, 379.26, 114.17, CW - 533.75];
    var bPages = paginate(A.branches, BOTTOM - 234.24, BOTTOM - 132.48);
    section(S, 1, "Mammograms by Branch", 199.68);
    rankedTable(S, 234.24, bPages[0], A.branches, { cols: bCols, head: "Branch" });
    slides.push(S);
    for (var p = 1; p < bPages.length; p++) {
      S = []; header(S, "Branches (cont.)", bdg);
      section(S, 1, "Mammograms by Branch (cont.)", 96);
      rankedTable(S, 132.48, bPages[p], A.branches, { cols: bCols, head: "Branch" });
      slides.push(S);
    }
    if (A.docs.length) {
      var dk = Object.keys(A.depts), dTitle = "Mammograms by Referring Physician" + (dk.length === 1 ? " (" + dk[0] + ")" : "");
      var dCols = [40.32, 275.59, 141.73, 114.17, CW - 571.81];

      dPages.forEach(function (pg, i) {
        S = []; header(S, "Referring Physicians", bdg);
        section(S, 2, dTitle + (i ? " (cont.)" : ""), 96);
        rankedTable(S, 132.48, pg, A.docs, { cols: dCols, head: "Physician", extra: "Branch" });

          var shp = e.t === "ellipse" ? P.ShapeType.ellipse : e.r ? P.ShapeType.roundRect : P.ShapeType.rect;

        } else if (e.t === "img") {

        } else if (e.t === "text") {
          s.addText(e.text, {
            x: I(e.x), y: I(e.y), w: I(e.w), h: I(e.h), margin: 0, fontFace: "Arial", fontSize: e.size,

var $=function(id){return document.getElementById(id);};
var files=[];            // parsed exports {key,name,branch,from,to,rows} or {name,error}
var model=null, agg=null;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ---------- drop zone ---------- */
function renderDrop(state,msg){
  var w=$("dropWrap");
  if(state==="hidden"){ w.innerHTML=""; return; }
  if(state==="busy"){
    w.innerHTML='<div class="drop" aria-live="polite"><div class="spin"></div><h2>جاري قراءة الملفات…</h2><p>'+esc(msg||"")+'</p></div>';
    return;
  }
  w.innerHTML='<div class="drop" id="drop" role="button" tabindex="0" aria-label="اختيار ملفات الإكسل">'+
    '<div class="ic"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 18v-6M9 15l3-3 3 3"/></svg></div>'+
    '<h2>اسحب ملفات الإكسل هنا أو اضغط للاختيار</h2>'+
    '<p>ملف لكل فرع من تقرير <b>Service wise Count – Detailed Category Wise</b>. ارفعها كلها مرة وحدة — إذا الفترة يوم واحد يطلع التقرير اليومي، وإذا أكثر يطلع تراكمي من أول يوم عرض.</p>'+
    (msg?'<div class="err" role="alert">'+esc(msg)+'</div>':'')+'</div>';
  var d=$("drop");
  d.onclick=function(){ $("file").click(); };
  d.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("file").click(); } };
}

/* ---------- reading ---------- */
function readFile(f){
  return new Promise(function(res){
    var fr=new FileReader();
    fr.onload=function(e){
      try{
        if(typeof XLSX==="undefined") throw new Error("lib");
        var wb=XLSX.read(e.target.result,{type:"array"});
        var out=null;
        for(var i=0;i<wb.SheetNames.length;i++){
          var aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]],{header:1,raw:true,defval:null});
          var p=MC.parseAoA(aoa,f.name);
          if(!p.error){ out=p; break; }
          if(!out) out=p;
        }
        out.name=f.name; res(out);
      }catch(err){ res({name:f.name,error:err&&err.message==="lib"?"lib":"read"}); }
    };
    fr.onerror=function(){ res({name:f.name,error:"read"}); };
    fr.readAsArrayBuffer(f);
  });
}
function addFiles(list){
  list=[].slice.call(list||[]).filter(function(f){ return /\.(xlsx|xls|csv)$/i.test(f.name||""); });
  if(!list.length){ if(!files.length) renderDrop("idle","الملف لازم يكون إكسل (xlsx أو xls) أو CSV."); else toast("الملف لازم يكون إكسل (xlsx أو xls) أو CSV."); return; }
  if(!files.length) renderDrop("busy",list.length+(list.length===1?" ملف":" ملفات"));
  Promise.all(list.map(readFile)).then(function(res){
    var replaced=[];
    res.forEach(function(p){
      if(p.error){ files=files.filter(function(x){return x.name!==p.name;}); files.push(p); return; }
      p.key=p.branch+"|"+p.from+"|"+p.to;
      var before=files.length;
      files=files.filter(function(x){ return x.key!==p.key && !(x.error && x.name===p.name); });
      if(files.length<before) replaced.push(p.branch);
      files.push(p);
    });
    if(replaced.length) toast("تم استبدال ملف "+replaced.join("، ")+" بالملف الجديد — ما ينحسب مرتين.");
    build();
  });
}

/* ---------- build + render ---------- */
function build(){
  var good=files.filter(function(f){return !f.error;});
  if(!good.length){
    var lib=files.some(function(f){return f.error==="lib";});
    files=[]; showActions(false); $("status").hidden=true; $("pages").innerHTML="";
    renderDrop("idle", lib?"ما قدرت أحمّل مكتبة قراءة الإكسل — تحقق من الاتصال وحدّث الصفحة.":"ما تعرّفت على الملف — تأكد أنه تصدير Service wise Count من النظام.");
    return;
  }
  agg=MC.aggregate(files); model=MC.buildModel(agg);
  renderDrop("hidden"); showActions(true); renderStatus(); renderPages();
}
function showActions(on){ $("actions").hidden=!on; }
function renderStatus(){
  var s=$("status"), h="";
  var ok=files.filter(function(f){return !f.error;}).sort(function(a,b){return (agg.byBranch[b.branch]||0)-(agg.byBranch[a.branch]||0)||a.branch.localeCompare(b.branch);});
  if(agg.from!==null) h+='<span class="per">'+(agg.daily?"تقرير يومي · ":"تراكمي · "+agg.nDays+" أيام · ")+'<bdi dir="ltr">'+esc(model.badge)+'</bdi></span>';
  var seen={};
  ok.forEach(function(f){ if(seen[f.branch])return; seen[f.branch]=1; h+='<span class="chip">'+esc(f.branch)+' · '+(agg.byBranch[f.branch]||0)+'</span>'; });
  files.filter(function(f){return f.error;}).forEach(function(f){ h+='<span class="chip warn" title="'+esc(f.name)+'">ملف غير معروف: '+esc(f.name.length>28?f.name.slice(0,26)+"…":f.name)+'</span>'; });
  if(agg.mixed) h+='<span class="chip warn">فترات الملفات مختلفة — التقرير من أول تاريخ لآخر تاريخ</span>';
  s.innerHTML=h; s.hidden=false;
}
function px(v){ return Math.round(v*100)/100+"px"; }
function hex(c){ return "#"+c; }
function paperHTML(prims){
  var h="";
  prims.forEach(function(e){
    var box="left:"+px(e.x)+";top:"+px(e.y)+";width:"+px(e.w||0)+";height:"+px(e.h||0)+";";
    if(e.t==="rect") h+='<div class="e" style="'+box+'background:'+hex(e.fill)+';border-radius:'+px(e.r||0)+'"></div>';
    else if(e.t==="ellipse") h+='<div class="e" style="'+box+'background:'+hex(e.fill)+';border-radius:50%"></div>';
    else if(e.t==="line") h+='<div class="e" style="left:'+px(e.x)+';top:'+px(e.y)+';width:'+px(e.w)+';height:.75px;background:'+hex(e.color)+'"></div>';
    else if(e.t==="img") h+='<img class="e" alt="Meena" src="'+LOGO+'" style="'+box+'">';
    else if(e.t==="text") h+='<div class="e tx" style="'+box+'font-size:'+px(e.size)+';font-weight:'+(e.bold?700:400)+';color:'+hex(e.color)+
      ';justify-content:'+(e.align==="center"?"center":e.align==="right"?"flex-end":"flex-start")+';letter-spacing:'+px(e.spc||0)+'"><span>'+esc(e.text)+'</span></div>';
    else if(e.t==="table"){
      var tw=e.cols.reduce(function(a,b){return a+b;},0), y=0, rows="";
      e.rows.forEach(function(r){
        var cells="";
        r.cells.forEach(function(c,i){
          cells+='<div class="td" style="width:'+px(e.cols[i])+';background:'+hex(c.fill)+';color:'+hex(c.color)+';font-size:'+px(c.size)+
            ';font-weight:'+(c.bold?700:400)+';justify-content:'+(c.align==="left"?"flex-start":c.align==="right"?"flex-end":"center")+'"><span>'+esc(c.text)+'</span></div>';
        });
        rows+='<div class="tr" style="top:'+px(y)+';height:'+px(r.h)+';width:'+px(tw)+';background:'+hex(r.cells[1].fill)+'">'+cells+(r.bb?'<div class="bb"></div>':'')+'</div>';
        y+=r.h;
      });
      h+='<div class="e" style="left:'+px(e.x)+';top:'+px(e.y)+';width:'+px(tw)+';height:'+px(y)+'">'+rows+'</div>';
    }
  });
  return h;
}
function renderPages(){
  var out="";
  model.slides.forEach(function(s,i){
    out+='<div class="frame" role="img" aria-label="Report page '+(i+1)+'"><div class="paper">'+paperHTML(s)+'</div></div>';
  });
  $("pages").innerHTML=out; fit();
}
function fit(){
  [].forEach.call(document.querySelectorAll(".frame"),function(f){
    var p=f.firstChild; if(p) p.style.transform="scale("+(f.clientWidth/960)+")";
  });
}
if(window.ResizeObserver){ new ResizeObserver(fit).observe($("pages")); } else window.addEventListener("resize",fit);

/* ---------- saving ---------- */
function deliver(blob,name,imgs){
  return Promise.resolve().then(function(){
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=name; a.style.display="none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },60000);
    toast("تم الحفظ: "+name);
  });
}
function failMsg(e,imgs){
  if(imgs&&imgs.length){ showImages(imgs); return; }
  toast("تعذّر تجهيز الملف — جرّب مرة ثانية.");
}
function capture(){
  var papers=[].slice.call(document.querySelectorAll(".paper")), imgs=[], chain=Promise.resolve();
  var fontsReady=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
  chain=fontsReady;
  papers.forEach(function(p){
    chain=chain.then(function(){
      var old=p.style.transform; p.style.transform="none";
      return html2canvas(p,{scale:2.5,backgroundColor:"#FFFFFF",width:960,height:551,windowWidth:1200,logging:false,useCORS:true})
        .then(function(cv){ p.style.transform=old; imgs.push(cv.toDataURL("image/jpeg",0.93)); },function(err){ p.style.transform=old; throw err; });
    });
  });
  return chain.then(function(){ return imgs; });
}
function savePdf(){
  if(!model) return;
  if(typeof html2canvas==="undefined"||!window.jspdf){ toast("ما قدرت أحمّل أداة الـ PDF — تحقق من الاتصال وحدّث الصفحة."); return; }
  var btn=$("btnPdf"), old=btn.innerHTML; btn.disabled=true; btn.textContent="جاري التجهيز…";
  var imgs=[];
  capture().then(function(list){
    imgs=list;
    var doc=new window.jspdf.jsPDF({orientation:"landscape",unit:"pt",format:[960,551],compress:true});
    list.forEach(function(src,i){ if(i) doc.addPage([960,551],"landscape"); doc.addImage(src,"JPEG",0,0,960,551); });
    return deliver(doc.output("blob"),model.fileBase+".pdf",imgs);
  }).catch(function(e){ failMsg(e,imgs); }).then(function(){ btn.disabled=false; btn.innerHTML=old; fit(); });
}
function savePptx(){
  if(!model) return;
  if(typeof PptxGenJS==="undefined"){ toast("ما قدرت أحمّل مكتبة PowerPoint — تحقق من الاتصال وحدّث الصفحة."); return; }
  var btn=$("btnPptx"), old=btn.innerHTML; btn.disabled=true; btn.textContent="جاري التجهيز…";
  Promise.resolve().then(function(){
    return MC.buildPptx(PptxGenJS,model,LOGO.replace(/^data:/,"")).write({outputType:"blob"});
  }).then(function(blob){ return deliver(blob,model.fileBase+".pptx",null); })
    .catch(function(e){ failMsg(e,null); }).then(function(){ btn.disabled=false; btn.innerHTML=old; });
}
function showImages(list){
  var old=$("shade"); if(old) old.remove();
  var sh=document.createElement("div"); sh.id="shade"; sh.className="shade";
  var h='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="row"><div><h3 id="shT">احفظ الصفحات كصور</h3>'+
    '<p>تعذّر الحفظ المباشر. اضغط مطوّلاً على الصورة (جوال) أو زر يمين ← Save image (كمبيوتر).</p></div>'+
    '<button class="btn" id="shClose" type="button">إغلاق</button></div>';
  list.forEach(function(src,i){ h+='<img src="'+src+'" alt="Report page '+(i+1)+'">'; });
  sh.innerHTML=h+'</div>'; document.body.appendChild(sh);
  function close(){ sh.remove(); document.removeEventListener("keydown",onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown",onKey);
  $("shClose").onclick=close; sh.addEventListener("click",function(e){ if(e.target===sh) close(); });
  $("shClose").focus();
}
function toast(msg){
  var t=$("toast"); if(t) t.remove();
  t=document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.remove(); },7000);
}

/* ---------- wiring ---------- */
$("file").addEventListener("change",function(e){ addFiles(e.target.files); e.target.value=""; });
$("btnAdd").addEventListener("click",function(){ $("file").click(); });
$("btnReset").addEventListener("click",function(){
  files=[]; model=null; agg=null; showActions(false); $("status").hidden=true; $("pages").innerHTML=""; renderDrop("idle");
});
$("btnPdf").addEventListener("click",savePdf);
$("btnPptx").addEventListener("click",savePptx);
["dragenter","dragover"].forEach(function(t){ document.addEventListener(t,function(e){ e.preventDefault(); var d=$("drop"); if(d) d.classList.add("over"); }); });
document.addEventListener("dragleave",function(e){ if(e.relatedTarget===null){ var d=$("drop"); if(d) d.classList.remove("over"); } });
document.addEventListener("drop",function(e){ e.preventDefault(); var d=$("drop"); if(d) d.classList.remove("over"); if(e.dataTransfer&&e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
renderDrop("idle");
})();
</script>
</body>
