# =====================================================================
#  Nginx أمام نظام إدارة الموظفين
#  يضعه setup.sh في /etc/nginx/sites-available/staff تلقائيًا، وهذا
#  الملف للمرجع ولمن ينشر يدويًا. استبدل staff.example.com بنطاقك.
#
#  الدور هنا ثلاثة: إنهاء TLS، وتمرير عنوان الزائر الحقيقي، وحدّ حجم
#  المرفوع. أما رؤوس الأمان فمصدرها التطبيق نفسه.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name staff.example.com;

    # كل شيء إلى https، ما عدا تحقق Let's Encrypt
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staff.example.com;

    ssl_certificate     /etc/letsencrypt/live/staff.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staff.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # بيانات موظفين: لا تُخزَّن في وسيط ولا في المتصفح
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12m;      # يوافق MAX_UPLOAD_MB مع هامش
    server_tokens off;

    access_log /var/log/nginx/staff-access.log;
    error_log  /var/log/nginx/staff-error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
