<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجل الموظفين — قاعدة بيانات الموارد البشرية</title>
</head>
<body>
<style>
/* ═══════════════ tokens ═══════════════ */
:root{
  color-scheme: light;
  --paper:#EEF0F6; --card:#FFFFFF; --sunk:#F5F6FA;
  --ink:#131834; --ink-2:#4B5273; --ink-3:#7C84A4;
  --line:#DDE1EC; --line-2:#EAEDF4;
  --brand:#2E3A8C; --brand-2:#4551B8; --brand-ink:#1E2668; --brand-soft:#E5E8F8; --on-brand:#FFFFFF;
  --seal:#96671A; --seal-soft:#F4EAD6;
  --good:#1C7A55; --good-soft:#DFF1E9;
  --warn:#8E640F; --warn-soft:#F7EBD3;
  --serious:#A9501E; --serious-soft:#FAE6DA;
  --crit:#A82838; --crit-soft:#FAE1E4;
  --bar:#2a78d6; --grid:#E6E9F1;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --shadow:0 1px 2px rgba(19,24,52,.05), 0 10px 26px -14px rgba(19,24,52,.20);
  --shadow-lg:0 2px 6px rgba(19,24,52,.08), 0 28px 60px -20px rgba(19,24,52,.32);
  --f-display:"Noto Kufi Arabic","Sakkal Majalla","Segoe UI",Tahoma,sans-serif;
  --f-body:"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
}
/* الواجهة الإنجليزية تأخذ خطوطًا لاتينية وتنقلب إلى اليسار */
:root[data-lang="en"]{
  --f-display:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --paper:#0B0E1B; --card:#141829; --sunk:#101425;
    --ink:#E8EBF5; --ink-2:#AAB2CE; --ink-3:#7B84A5;
    --line:#252B44; --line-2:#1C2135;
    --brand:#8892F2; --brand-2:#A2AAF7; --brand-ink:#B9BFFA; --brand-soft:#1D2246; --on-brand:#0B0E1B;
    --seal:#D2A65A; --seal-soft:#2A2314;
    --good:#4FBF8B; --good-soft:#102A22;
    --warn:#D9A83F; --warn-soft:#2C2412;
    --serious:#E4864F; --serious-soft:#2E1E14;
    --crit:#E5697A; --crit-soft:#2E1720;
    --bar:#3987e5; --grid:#212741;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
    --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -14px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 28px 60px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0B0E1B; --card:#141829; --sunk:#101425;
  --ink:#E8EBF5; --ink-2:#AAB2CE; --ink-3:#7B84A5;
  --line:#252B44; --line-2:#1C2135;
  --brand:#8892F2; --brand-2:#A2AAF7; --brand-ink:#B9BFFA; --brand-soft:#1D2246; --on-brand:#0B0E1B;
  --seal:#D2A65A; --seal-soft:#2A2314;
  --good:#4FBF8B; --good-soft:#102A22;
  --warn:#D9A83F; --warn-soft:#2C2412;
  --serious:#E4864F; --serious-soft:#2E1E14;
  --crit:#E5697A; --crit-soft:#2E1720;
  --bar:#3987e5; --grid:#212741;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -14px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 28px 60px -20px rgba(0,0,0,.8);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:14px; line-height:1.65;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{ font-family:var(--f-display); margin:0; font-weight:700; line-height:1.35; text-wrap:balance; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:6px; }
.num{ font-variant-numeric:tabular-nums; }
.mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.muted{ color:var(--ink-3); }
.grow{ flex:1; }

/* ═══════════════ الشريط الكحلي ═══════════════ */
.appbar{
  background:linear-gradient(180deg, #24336E, #1C2755);
  color:#FFFFFF; border-bottom:3px solid var(--seal);
  position:sticky; top:0; z-index:40;
}
:root[data-theme="dark"] .appbar,
:root:where(:not([data-theme="light"])) .appbar{ background:linear-gradient(180deg, #1A2450, #131B3C); }
.appbar-in{
  max-width:1180px; margin:0 auto; padding:11px 20px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.org{ display:flex; flex-direction:column; line-height:1.3; min-width:0; }
.org b{ font-family:var(--f-display); font-size:18px; letter-spacing:.01em; }
.org em{ font-style:normal; font-size:11.5px; color:#B9C2E8; }
.tools{ display:flex; align-items:center; gap:6px; }
.tbtn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
  height:34px; padding:0 11px; border-radius:9px; font-size:12.5px; font-weight:600;
  color:#EAEEFB; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.20);
  transition:background .15s, border-color .15s;
}
.tbtn:hover{ background:rgba(255,255,255,.20); border-color:rgba(255,255,255,.38); }
.tbtn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
.tbtn svg{ width:15px; height:15px; flex:none; }
.tbtn.only{ width:34px; padding:0; }
.tbtn.lang{ font-family:var(--f-display); letter-spacing:.02em; }
.mark{
  width:36px; height:36px; flex:none; display:grid; place-items:center; border-radius:9px;
  background:#FFFFFF; color:#1C2755;
}
.mark svg{ width:21px; height:21px; }

/* ═══════════════ الأزرار ═══════════════ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;
  padding:9px 16px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-size:13.5px; font-weight:600;
  transition:background .15s, border-color .15s, transform .06s;
}
.btn:hover{ background:var(--sunk); border-color:var(--ink-3); }
.btn:active{ transform:translateY(1px); }
.btn.primary{ background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
.btn.primary:hover{ background:var(--brand-2); border-color:var(--brand-2); }
.btn.ghost{ background:transparent; }
.btn.danger{ color:var(--crit); border-color:color-mix(in srgb, var(--crit) 35%, var(--line)); }
.btn.danger:hover{ background:var(--crit-soft); }
.btn.icon{ padding:8px; width:36px; height:36px; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn svg{ width:16px; height:16px; flex:none; }

/* ═══════════════ نموذج الإدخال ═══════════════ */
.wrap{ max-width:1180px; margin:0 auto; padding:24px 20px 90px; }
.formcard{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); padding:22px 26px 20px; max-width:980px; margin:0 auto;
}
.formtitle{ text-align:center; font-size:18px; margin-bottom:20px; }
.formtitle::after{
  content:""; display:block; width:64px; height:2px; margin:9px auto 0;
  background:var(--seal); border-radius:2px;
}
.fgrid2{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:11px 30px; }
.fld{ display:flex; align-items:center; gap:10px; min-width:0; }
.fld > span{ flex:0 0 128px; text-align:end; font-size:13px; font-weight:600; color:var(--ink-2); }
.fld > span b{ color:var(--crit); font-weight:700; }
.fld input{
  flex:1 1 auto; min-width:0; padding:8px 11px; border-radius:8px;
  border:1px solid var(--line); color:var(--ink);
  background:color-mix(in srgb, var(--sunk) 55%, var(--line));
}
.fld input:focus{ background:var(--card); border-color:var(--brand); }
.fld.metric > span{ flex-basis:78px; }
.fld.metric input{ max-width:96px; }
.fsplit{ grid-column:1 / -1; display:flex; align-items:center; gap:12px; margin:6px 0 2px; }
.fsplit span{ font-family:var(--f-display); font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--seal); }
.fsplit i{ flex:1; height:1px; background:var(--line); }
.hint{ text-align:center; font-size:12.5px; margin:16px 0 0; min-height:1.2em; color:var(--ink-3); }
.hint.warn{ color:var(--seal); font-weight:600; }
.hint.bad{ color:var(--crit); font-weight:600; }
.actions{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:14px; }
.actions .btn{ min-width:132px; height:44px; font-size:14.5px; }
@media (max-width:760px){
  .fgrid2{ grid-template-columns:1fr; }
  .fld > span{ flex-basis:100px; }
  .formcard{ padding:18px 16px 16px; }
  .actions .btn{ flex:1; min-width:0; }
}
.count{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin:26px auto 0; max-width:980px; font-size:13px; color:var(--ink-3);
}
.count b{ color:var(--ink); font-weight:700; }

/* ═══════════════ جدول القاعدة ═══════════════ */
.sheet{ max-width:1180px; margin:28px auto 0; }
.sheet-head{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
.sheet-head h2{ font-size:16px; }
.count{ margin:0; font-size:12.5px; color:var(--ink-3); }
.count b{ color:var(--ink); font-weight:700; }
.tbl{
  overflow:auto; max-height:66vh; background:var(--card);
  border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
}
table.db{ width:100%; min-width:1580px; border-collapse:separate; border-spacing:0; font-size:12.5px; }
table.db thead th{
  position:sticky; top:0; z-index:2; background:var(--sunk); text-align:start;
  padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
  font-family:var(--f-display); font-size:11px; font-weight:700; color:var(--ink-2);
}
table.db thead th small{ display:block; font-family:var(--f-mono); font-size:9.5px; font-weight:400; color:var(--ink-3); }
table.db thead th.key{ color:var(--brand); }
table.db thead th.act{ width:40px; }
table.db td{ padding:7px 10px; border-bottom:1px solid var(--line-2); white-space:nowrap; }
table.db td.empty{ color:var(--ink-3); }
table.db td.br{ border-inline-start:3px solid var(--c, transparent); }
table.db tbody tr{ cursor:pointer; }
table.db tbody tr:hover td{ background:var(--sunk); }
table.db tbody tr:last-child td{ border-bottom:0; }
table.db tbody tr.hit td{ background:var(--brand-soft); }
table.db tbody tr.hit td:first-child{ box-shadow:inset 3px 0 0 var(--brand); }
.rowfile{
  width:26px; height:26px; display:grid; place-items:center; border-radius:7px; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--ink-3);
}
.rowfile:hover{ background:var(--brand-soft); color:var(--brand); border-color:var(--brand); }
.rowfile svg{ width:13px; height:13px; }
.flagcell{ font-family:var(--f-mono); font-weight:700; }
.flagcell.warn{ color:var(--warn); }
.flagcell.serious{ color:var(--serious); }
.flagcell.crit{ color:var(--crit); }
.more{ display:flex; justify-content:center; margin-top:16px; }
.dbnote{ font-size:12px; color:var(--ink-3); margin:12px 0 0; }

/* ═══════════════ الحالات الفارغة ═══════════════ */
.state{
  text-align:center; padding:48px 24px; background:var(--card);
  border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); margin-top:20px;
}
.state .mark-lg{
  width:60px; height:60px; margin:0 auto 16px; border-radius:16px; display:grid; place-items:center;
  background:var(--brand-soft); color:var(--brand);
  border:1px solid color-mix(in srgb, var(--brand) 25%, transparent);
}
.state .mark-lg svg{ width:28px; height:28px; }
.state h3{ font-size:17px; margin-bottom:6px; }
.state p{ margin:0 auto 18px; max-width:50ch; color:var(--ink-3); font-size:13px; }
.state .row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }

/* ═══════════════ النوافذ ═══════════════ */
.modal{ position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:18px; }
.modal[hidden]{ display:none; }
.modal .veil{ position:absolute; inset:0; background:rgba(11,14,27,.55); backdrop-filter:blur(2px); }
.modal .box{
  position:relative; width:min(720px, 100%); max-height:88vh; overflow:auto;
  background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow-lg);
}
.modal .box.wide{ width:min(1000px, 100%); }
.modal .box.full{ width:min(1440px, 100%); }
#mView{ z-index:80; }
#mEmp{ z-index:90; }   /* نموذج الإدخال يعلو ملف الموظف الذي فُتح منه */


.mhead{
  display:flex; align-items:center; gap:12px; padding:15px 20px;
  border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); z-index:2;
}
.mhead h3{ font-size:16px; }
.mbody{ padding:20px; }
.mfoot{
  display:flex; gap:8px; align-items:center; padding:13px 20px;
  border-top:1px solid var(--line); position:sticky; bottom:0; background:var(--card);
}

/* ملف الموظف داخل النافذة */
.pro-head{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:6px; }
.pro-head h2{ font-size:19px; }
.pro-head .role{ color:var(--ink-2); font-size:13px; }
.pro-head .idline{ font-family:var(--f-mono); font-size:12px; color:var(--ink-3); }
.sec{ margin-top:18px; }
.sec > .lbl{
  font-family:var(--f-display); font-size:11px; font-weight:700; letter-spacing:.1em;
  color:var(--seal); margin:0 0 8px;
}
.kv.big > div{ padding:10px 12px; }
.kv.big dt{ font-size:11px; }
.kv.big dd{ font-size:13.5px; white-space:normal; }
.tiles{ display:grid; grid-template-columns:repeat(auto-fit, minmax(132px,1fr)); gap:10px; }
.tile{ padding:13px 14px; border-radius:11px; border:1px solid var(--line); background:var(--card); border-top:3px solid var(--tone, var(--line)); }
.tile .k{ font-size:11.5px; color:var(--ink-3); font-weight:600; }
.tile .v{ font-family:var(--f-display); font-size:25px; font-weight:700; line-height:1.2; color:var(--tone-ink, var(--ink)); }
.tile .s{ font-size:11.5px; color:var(--ink-3); }
.verdict{
  display:inline-flex; align-items:center; gap:8px; padding:5px 13px; border-radius:999px;
  background:var(--tone-soft); color:var(--tone-ink);
  border:1px solid color-mix(in srgb, var(--tone) 32%, transparent); font-weight:700; font-size:12.5px;
}
.verdict svg{ width:14px; height:14px; }

/* نموذج الإدخال */
fieldset{ border:0; padding:0; margin:0 0 18px; }
fieldset legend{
  font-family:var(--f-display); font-size:11px; font-weight:700; letter-spacing:.1em;
  color:var(--seal); padding:0; margin-bottom:9px;
}
.fgrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px; }
.fgrid label{ display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:600; color:var(--ink-2); }
input[type="text"], input[type="date"], input[type="email"], input[type="tel"], input[type="number"], select{
  padding:9px 11px; border-radius:9px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); width:100%; min-width:0;
}
input:read-only{ background:var(--sunk); color:var(--ink-2); }
.err{ color:var(--crit); font-size:11.5px; font-weight:600; }
.err:empty{ display:none; }
input[aria-invalid="true"]{ border-color:var(--crit); background:var(--crit-soft); }

/* الاستيراد */
.drop{
  border:1.5px dashed var(--line); border-radius:13px; padding:26px 18px; text-align:center;
  background:var(--sunk); cursor:pointer; transition:border-color .15s, background .15s;
}
.drop:hover, .drop.over{ border-color:var(--brand); background:var(--brand-soft); }
.drop b{ display:block; font-family:var(--f-display); font-size:14px; margin-bottom:3px; }
.drop span{ font-size:12px; color:var(--ink-3); }
.maprow{ display:grid; grid-template-columns:minmax(110px,1fr) minmax(130px,1.2fr); gap:8px; align-items:center; padding:5px 0; }
.maprow > span{ font-size:12.5px; font-weight:600; }
.note{
  padding:11px 13px; border-radius:10px; font-size:12.5px;
  background:var(--brand-soft); color:var(--brand-ink);
  border:1px solid color-mix(in srgb, var(--brand) 22%, transparent);
}
.note.bad{ background:var(--crit-soft); color:var(--crit); border-color:color-mix(in srgb, var(--crit) 28%, transparent); }

/* المؤشرات */
.kpis{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:11px; margin-bottom:16px; }
.kpi{ padding:14px 16px; border-radius:12px; background:var(--sunk); border:1px solid var(--line); }
.kpi .k{ font-size:11.5px; color:var(--ink-3); font-weight:600; }
.kpi .v{ font-family:var(--f-display); font-size:28px; font-weight:700; line-height:1.15; }
.kpi .s{ font-size:11.5px; color:var(--ink-3); }
.charts{ display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:14px; }
.chart{ padding:16px; border-radius:12px; border:1px solid var(--line); background:var(--card); }
.chart h3{ font-size:13.5px; margin-bottom:2px; }
.chart .cap{ font-size:11.5px; color:var(--ink-3); margin:0 0 13px; }
.bars{ display:flex; flex-direction:column; gap:9px; }
.bar-row{ display:grid; grid-template-columns:minmax(66px, 30%) 1fr auto; gap:10px; align-items:center; font-size:12.5px; }
.bar-row .lb{ color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-track{ position:relative; height:11px; background:var(--grid); border-radius:4px; }
.bar-fill{ position:absolute; inset-inline-start:0; top:0; height:100%; background:var(--bar); border-radius:4px 0 0 4px; min-width:3px; }
.bar-row .vl{ font-family:var(--f-mono); font-size:12px; color:var(--ink-2); min-width:2.5ch; }
.cols{ display:flex; align-items:flex-end; gap:6px; height:140px; padding-top:6px; border-bottom:1px solid var(--line); }
.col{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:5px; height:100%; }
.col .fill{ width:100%; max-width:34px; background:var(--bar); border-radius:4px 4px 0 0; min-height:3px; }
.col .cl{ font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); }
.col-labels{ display:flex; gap:6px; padding-top:6px; }
.col-labels span{ flex:1; text-align:center; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); }
.chart-empty{ padding:24px 0; text-align:center; color:var(--ink-3); font-size:12.5px; }

#tip{
  position:fixed; z-index:96; pointer-events:none; opacity:0; transform:translateY(4px);
  background:var(--ink); color:var(--paper); font-size:12px; font-weight:600;
  padding:6px 10px; border-radius:7px; box-shadow:var(--shadow); transition:opacity .12s, transform .12s;
  max-width:220px;
}
#tip.on{ opacity:1; transform:translateY(0); }
#tip small{ display:block; font-weight:400; opacity:.75; font-size:11px; }

#toasts{ position:fixed; inset-block-end:18px; inset-inline-start:50%; transform:translateX(50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center; }
.toast{
  background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:10px;
  font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); animation:pop .2s ease;
}
.toast.err{ background:var(--crit-soft); color:var(--crit); box-shadow:var(--shadow-lg), inset 0 0 0 1px color-mix(in srgb, var(--crit) 35%, transparent); }
.toast.ok{ background:var(--good-soft); color:var(--good); box-shadow:var(--shadow-lg), inset 0 0 0 1px color-mix(in srgb, var(--good) 35%, transparent); }
@keyframes pop{ from{ opacity:0; transform:translateY(8px); } }

<script>
(() => {
"use strict";

document.documentElement.lang = "ar";
document.documentElement.dir  = "rtl";

/* ═════════════════════════════════════════════════════════════════
   1 · مخطَّط القاعدة
   الحقول الستة عشر نفسها الموجودة في ورقة Employees، ولكل حقل نوعه
   وقيوده وتلميحات مطابقة العناوين عند الاستيراد.
   ═════════════════════════════════════════════════════════════════ */
const FIELDS = [
  { k:"id",         xl:"Employee ID", ar:"الرقم الوظيفي",  t:"text",  req:true, mono:true, group:"identity",
    hints:["employeeid","empid","employeeno","staffid","staffno","id","رقمالموظف","الرقمالوظيفي"] },
  { k:"name",       xl:"Name",        ar:"الاسم",           t:"text",  req:true, group:"identity",
    hints:["name","employeename","fullname","staffname","الاسم"] },
  { k:"nationalId", xl:"National ID", ar:"رقم الهوية",      t:"text",  mono:true, group:"identity",
    hints:["nationalid","iqama","idnumber","nid","رقمالهوية","الهوية"] },
  { k:"mobile",     xl:"Mobile",      ar:"الجوال",          t:"tel",   mono:true, group:"contact",
    hints:["mobile","phone","cell","contact","الجوال","الهاتف"] },
  { k:"email",      xl:"Email",       ar:"البريد الإلكتروني", t:"email", group:"contact",
    hints:["email","mail","البريد"] },
  { k:"dob",        xl:"DOB",         ar:"تاريخ الميلاد",   t:"date",  group:"identity",
    hints:["dob","dateofbirth","birthdate","birth","تاريخالميلاد"] },
  { k:"nationality",xl:"Nationality", ar:"الجنسية",         t:"text",  facet:true, group:"identity",
    hints:["nationality","country","الجنسية"] },
  { k:"branch",     xl:"Branch",      ar:"الفرع",           t:"text",  facet:true, group:"job",
    hints:["branch","center","centre","site","location","الفرع","المركز"] },
  { k:"department", xl:"Department",  ar:"القسم",           t:"text",  facet:true, group:"job",
    hints:["department","departmentname","dept","specialty","القسم"] },
  { k:"jobTitle",   xl:"Job Title",   ar:"المسمى الوظيفي",  t:"text",  facet:true, group:"job",
    hints:["jobtitle","title","position","designation","role","المسمى","الوظيفة"] },
  { k:"manager",    xl:"Manager",     ar:"المدير المباشر",  t:"text",  group:"job",
    hints:["manager","supervisor","reportsto","directmanager","المدير"] },
  { k:"hireDate",   xl:"Hire Date",   ar:"تاريخ التعيين",   t:"date",  group:"job",
    hints:["hiredate","joindate","joiningdate","startdate","doj","تاريخالتعيين","المباشرة"] },
  { k:"absence",    xl:"Absence",     ar:"الغياب",          t:"int", metric:true, tone:"warn",    unit:"يوم", unitEn:"day",  group:"conduct",
    hints:["absence","absent","absences","الغياب"] },
  { k:"late",       xl:"Late",        ar:"التأخير",         t:"int", metric:true, tone:"warn",    unit:"مرة", unitEn:"time",  group:"conduct",
    hints:["late","lateness","tardy","delay","التأخير"] },
  { k:"violations", xl:"Violations",  ar:"المخالفات",       t:"int", metric:true, tone:"serious", unit:"مخالفة", unitEn:"violation", group:"conduct",
    hints:["violations","violation","offences","المخالفات"] },
  { k:"warnings",   xl:"Warnings",    ar:"الإنذارات",       t:"int", metric:true, tone:"crit",    unit:"إنذار", unitEn:"warning", group:"conduct",
    hints:["warnings","warning","notices","الإنذارات","الإنذار"] },
];
const F = Object.fromEntries(FIELDS.map(f => [f.k, f]));
const METRICS = FIELDS.filter(f => f.metric);
const GROUPS = ["identity", "contact", "job", "conduct"];

/* ═════════════════════════════════════════════════════════════════
   2 · أدوات عامة
   ═════════════════════════════════════════════════════════════════ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const key = s => String(s ?? "").toLowerCase().replace(/[\s_\-./\\()]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه");
const uniq = a => [...new Set(a)];
let nf = new Intl.NumberFormat("ar-SA-u-nu-latn");   /* يتبدّل مع اللغة */
const fmt = n => nf.format(n);

function toast(msg, kind) {
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : "");
  t.textContent = msg;
  $("#toasts").append(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; }, 2800);
  setTimeout(() => t.remove(), 3200);
}

function save(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* لون هوية ثابت لكل فرع: يُشتق من اسم الفرع لا من ترتيبه في الجدول، فلا
   يتبدّل اللون حين تُصفّى القائمة. وإن تصادف فرعان على خانة واحدة انتقل
   الثاني إلى أول خانة حرّة، لئلا يحمل فرعان اللون نفسه. */
const slotOf = v => { let h = 0; for (let i = 0; i < v.length; i++) h = (h * 31 + v.charCodeAt(i)) >>> 0; return h % 8; };
let _hueKey = null, _hueMap = new Map();
function hueMap() {
  const list = uniq(state.rows.map(r => r.branch).filter(Boolean)).sort((a, b) => a.localeCompare(b, "ar"));
  const k = list.join("␀");
  if (k === _hueKey) return _hueMap;
  const used = new Set(), m = new Map();
  for (const b of list) {
    let s = slotOf(b), n = 0;
    while (used.has(s) && n < 8) { s = (s + 1) % 8; n++; }
    used.add(s); m.set(b, s + 1);
  }
  _hueKey = k; _hueMap = m;
  return m;
}
function hueOf(s) {
  const v = String(s || "");
  if (!v) return "var(--ink-3)";
  return "var(--c" + (hueMap().get(v) || slotOf(v) + 1) + ")";
}
const initials = name => {
  const p = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!p.length) return "؟";
  return (p[0][0] || "") + (p.length > 1 ? p[p.length - 1][0] || "" : "");
};

/* ── التواريخ ──────────────────────────────────────────────────── */
const MON = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

/* يقبل رقم إكسل التسلسلي وصيغ النص الشائعة، ويخرج دائمًا YYYY-MM-DD */
function toISO(v) {
  if (v == null || v === "") return "";
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  if (/^\d+(\.\d+)?$/.test(s)) {
    const n = parseFloat(s);
    if (n >= 1000 && n <= 80000) {
      const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000);
      return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
    }
    return "";
  }
  let m = /^(\d{1,2})[-/\s](\d{1,2})[-/\s](\d{4})$/.exec(s);
  if (m) {                                   // يوم/شهر/سنة، وتُقلب إن جاوز الأول 12
    let [, a, b, y] = m;
    let dd = +a, mm = +b;
    if (dd <= 12 && mm > 12) { const t = dd; dd = mm; mm = t; }
    if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return y + "-" + pad(mm) + "-" + pad(dd);
    return "";
  }
  m = /^(\d{1,2})[-/\s]([A-Za-z]{3,})[-/\s](\d{4})$/.exec(s);
  if (m) {
    const mi = MON.indexOf(m[2].slice(0, 3).toLowerCase());
    if (mi >= 0) return m[3] + "-" + pad(mi + 1) + "-" + pad(+m[1]);
  }
  const t = Date.parse(s);
  return isFinite(t) ? iso(new Date(t)) : "";
}

const today = () => new Date();
function yearsBetween(isoDate, to = today()) {
  if (!isoDate) return null;
  const d = new Date(isoDate + "T00:00:00");
  if (isNaN(d)) return null;
  let y = to.getFullYear() - d.getFullYear();
  const m = to.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && to.getDate() < d.getDate())) y--;
  return y < 0 ? null : y;
}
function tenureText(isoDate) {
  if (!isoDate) return "";
  const d = new Date(isoDate + "T00:00:00");
  if (isNaN(d)) return "";
  const now = today();
  let months = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if (now.getDate() < d.getDate()) months--;
  if (months < 0) return "";
  const y = Math.floor(months / 12), mo = months % 12;
  if (y && mo) return t("d.yearsMonths", fmt(y), fmt(mo));
  if (y) return t("d.years", fmt(y));
  return t("d.months", fmt(mo));
}

/* ═════════════════════════════════════════════════════════════════
   3 · طبقة القاعدة — IndexedDB
   مخزن employees مفتاحه الرقم الوظيفي، وعليه فهارس الفرع والقسم
   والجنسية وتاريخ التعيين، ومخزن meta للإعدادات.
   ═════════════════════════════════════════════════════════════════ */
const DB = { name: "aogh_hr", ver: 1, store: "employees", meta: "meta" };
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DB.name, DB.ver);
    rq.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(DB.store)) {
        const st = d.createObjectStore(DB.store, { keyPath: "id" });
        st.createIndex("branch", "branch", { unique: false });
        st.createIndex("department", "department", { unique: false });
        st.createIndex("nationality", "nationality", { unique: false });
        st.createIndex("name", "name", { unique: false });
        st.createIndex("hireDate", "hireDate", { unique: false });
      }
      if (!d.objectStoreNames.contains(DB.meta)) d.createObjectStore(DB.meta, { keyPath: "k" });
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
const tx = (mode, store = DB.store) => db.transaction(store, mode).objectStore(store);
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

const dbAll    = () => req(tx("readonly").getAll());
const dbPut    = rec => req(tx("readwrite").put(rec));
const dbDelete = id  => req(tx("readwrite").delete(id));
const dbClear  = ()  => req(tx("readwrite").clear());
function dbPutMany(recs) {
  return new Promise((res, rej) => {
    const t = db.transaction(DB.store, "readwrite"), st = t.objectStore(DB.store);
    for (const r of recs) st.put(r);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}

/* سجل فارغ مطابق للمخطَّط */
function blank() {
  const o = {};
  for (const f of FIELDS) o[f.k] = f.t === "int" ? 0 : "";
  return o;
}
/* تنظيف أي كائن وارد ليطابق الأنواع قبل الحفظ */
function coerce(raw) {
  const o = blank();
  for (const f of FIELDS) {
    const v = raw[f.k];
    if (f.t === "int") { const n = Math.round(Number(String(v ?? "").replace(/[^\d.-]/g, ""))); o[f.k] = isFinite(n) && n > 0 ? n : 0; }
    else if (f.t === "date") o[f.k] = toISO(v);
    else o[f.k] = String(v ?? "").trim().replace(/\s+/g, " ");
  }
  o.id = o.id.replace(/\s/g, "");
  o.createdAt = raw.createdAt || new Date().toISOString();
  o.updatedAt = new Date().toISOString();
  return o;
}

/* ── القيود ─────────────────────────────────────────────────────── */
function validate(rec, { isNew }) {
  const e = {};
  if (!rec.id) e.id = t("v.idReq");
  else if (isNew && state.byId.has(rec.id)) e.id = t("v.idDup");
  if (!rec.name) e.name = t("v.nameReq");
  if (rec.nationalId && !/^\d{10}$/.test(rec.nationalId)) e.nationalId = t("v.nid");
  if (rec.mobile && !/^(\+?966|0)?5\d{8}$/.test(rec.mobile.replace(/[\s-]/g, ""))) e.mobile = t("v.mobile");
  if (rec.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(rec.email)) e.email = t("v.email");
  for (const f of FIELDS) {
    if (f.t === "date" && rec[f.k] && isNaN(new Date(rec[f.k] + "T00:00:00"))) e[f.k] = t("v.date");
    if (f.t === "int" && rec[f.k] < 0) e[f.k] = t("v.neg");
  }
  if (rec.dob && rec.hireDate && rec.hireDate < rec.dob) e.hireDate = t("v.hireDob");
  return e;
}

/* ═════════════════════════════════════════════════════════════════
   4 · حزم ZIP — قراءة إكسل وكتابته داخل المتصفح بلا مكتبات
   ═════════════════════════════════════════════════════════════════ */
const RT = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const CRC = (() => { const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; }
  return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
const pipe = (u8, tr) => new Response(new Blob([u8]).stream().pipeThrough(tr)).arrayBuffer().then(b => new Uint8Array(b));

async function zipRead(ab) {
  const u8 = new Uint8Array(ab), dv = new DataView(ab);
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error(t("e.zip"));
  const count = dv.getUint16(e + 10, true);
  let off = dv.getUint32(e + 16, true);
  const dec = new TextDecoder(), map = new Map();
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
    const nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = dec.decode(u8.subarray(off + 46, off + 46 + nl));
    if (!name.endsWith("/")) map.set(name, { method, csize, lho });
    off += 46 + nl + el + cl;
  }
  const out = new Map();
  for (const [name, it] of map) {
    const nl = dv.getUint16(it.lho + 26, true), el = dv.getUint16(it.lho + 28, true);
    const raw = u8.subarray(it.lho + 30 + nl + el, it.lho + 30 + nl + el + it.csize);
    if (it.method === 0) out.set(name, raw);
    else if (it.method === 8) out.set(name, await pipe(raw, new DecompressionStream("deflate-raw")));
    else throw new Error(t("e.method"));
  }
  return out;
}

async function zipWrite(parts, mime) {
  const enc = new TextEncoder(), locals = [], centrals = [];
  const now = new Date();
  const time = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const date = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  let offset = 0, n = 0;
  for (const [name, data0] of parts) {
    const data = typeof data0 === "string" ? enc.encode(data0) : data0;
    const nm = enc.encode(name), crc = crc32(data);
    let body = data, method = 0;
    try { const d = await pipe(data, new CompressionStream("deflate-raw")); if (d.length < data.length) { body = d; method = 8; } } catch {}
    const lh = new Uint8Array(30 + nm.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, method, true); lv.setUint16(10, time, true); lv.setUint16(12, date, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, body.length, true); lv.setUint32(22, data.length, true);
    lv.setUint16(26, nm.length, true); lh.set(nm, 30);
    locals.push(lh, body);
    const ch = new Uint8Array(46 + nm.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, method, true);
    cv.setUint16(12, time, true); cv.setUint16(14, date, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, body.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, nm.length, true); cv.setUint32(42, offset, true); ch.set(nm, 46);
    centrals.push(ch);
    offset += lh.length + body.length;
    n++;
  }
  const cd = centrals.reduce((s, c) => s + c.length, 0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, n, true); ev.setUint16(10, n, true);
  ev.setUint32(12, cd, true); ev.setUint32(16, offset, true);
  return new Blob([...locals, ...centrals, eo], { type: mime });
}

/* ── قراءة ورقة العمل ───────────────────────────────────────────── */
const colIdx = ref => { let n = 0; for (const ch of ref) { const c = ch.charCodeAt(0); if (c >= 65 && c <= 90) n = n * 26 + (c - 64); else break; } return n - 1; };
const colRef = i => { let s = "", n = i + 1; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };

function parseCSV(txt) {
  if (txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1);
  const grid = []; let row = [], cell = "", q = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); grid.push(row); row = []; cell = ""; }
    else if (ch !== "\r") cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); grid.push(row); }
  return grid.map(r => r.map(c => c.trim()));
}

/* يعيد كل أوراق المصنّف كشبكات نصية، فيُختار منها ورقة الموظفين */
async function readWorkbook(file) {
  if (/\.csv$/i.test(file.name)) return [{ name: file.name.replace(/\.csv$/i, ""), grid: parseCSV(await file.text()) }];
  const parts = await zipRead(await file.arrayBuffer());
  const dec = new TextDecoder();
  const doc = n => { const b = parts.get(n); return b ? new DOMParser().parseFromString(dec.decode(b), "application/xml") : null; };
  const shared = [];
  const ss = doc("xl/sharedStrings.xml");
  if (ss) for (const si of ss.getElementsByTagName("si")) {
    let s = "";
    for (const t of si.getElementsByTagName("t")) if (t.parentNode.nodeName !== "rPh") s += t.textContent;
    shared.push(s);
  }
  const wb = doc("xl/workbook.xml"), rels = doc("xl/_rels/workbook.xml.rels");
  const relMap = new Map();
  if (rels) for (const r of rels.getElementsByTagName("Relationship"))
    relMap.set(r.getAttribute("Id"), "xl/" + r.getAttribute("Target").replace(/^\/?xl\//, "").replace(/^\//, ""));
  const sheets = [];
  if (wb) for (const sh of wb.getElementsByTagName("sheet")) {
    const rid = sh.getAttribute("r:id") || sh.getAttributeNS(RT, "id");
    const path = relMap.get(rid);
    if (path && parts.has(path)) sheets.push({ name: sh.getAttribute("name") || "", path });
  }
  if (!sheets.length) {
    const p = [...parts.keys()].find(n => /^xl\/worksheets\/[^/]+\.xml$/.test(n));
    if (!p) throw new Error(t("e.nosheet"));
    sheets.push({ name: "Sheet1", path: p });
  }
  return sheets.map(s => {
    const ws = doc(s.path), grid = [];
    for (const row of ws.getElementsByTagName("row")) {
      const cells = [];
      for (const c of row.getElementsByTagName("c")) {
        const r = c.getAttribute("r"), i = r ? colIdx(r) : cells.length, t = c.getAttribute("t");
        let v = "";
        if (t === "inlineStr") v = [...c.getElementsByTagName("t")].map(x => x.textContent).join("");
        else { const vn = c.getElementsByTagName("v")[0], raw = vn ? vn.textContent : "";
               v = t === "s" ? (shared[+raw] ?? "") : raw; }
        cells[i] = String(v).trim();
      }
      const rn = +row.getAttribute("r");
      if (rn) grid[rn - 1] = cells; else grid.push(cells);
    }
    for (let i = 0; i < grid.length; i++) if (!grid[i]) grid[i] = [];
    return { name: s.name, grid };
  });
}

const isNumish = v => v !== "" && v != null && isFinite(parseFloat(String(v).replace(/[^\d.-]/g, ""))) && /^[\s\d.,%+-]+$/.test(String(v));

/* سطر العناوين قد لا يكون الأول: يُختار أعرض سطر نصّي تحته بيانات */
function findHeaderRow(grid) {
  let best = 0, bestScore = -1;
  for (let i = 0; i < Math.min(grid.length, 30); i++) {
    const cells = (grid[i] || []).filter(c => c !== "" && c != null);
    if (cells.length < 2) continue;
    const textish = cells.filter(c => !isNumish(c)).length / cells.length;
    const matched = cells.filter(c => FIELDS.some(f => f.hints.includes(key(c)) || key(f.xl) === key(c))).length;
    const score = cells.length * textish + matched * 5 + (textish === 1 ? 3 : 0);
    if (score > bestScore) { bestScore = score; best = i; }
  }
  return best;
}

function guessMap(headers) {
  const map = {}, taken = new Set();
  for (const f of FIELDS) {
    let hit = -1;
    headers.forEach((h, i) => {
      if (hit >= 0 || taken.has(i) || !h) return;
      const k = key(h);
      if (k === key(f.xl) || f.hints.includes(k)) hit = i;
    });
    if (hit < 0) headers.forEach((h, i) => {
      if (hit >= 0 || taken.has(i) || !h) return;
      const k = key(h);
      if (f.hints.some(x => x.length > 3 && (k.includes(x) || x.includes(k)))) hit = i;
    });
    if (hit >= 0) { map[f.k] = hit; taken.add(hit); }
  }
  return map;
}

let lang = "ar";
const LANGS = ["ar", "en"];

/* t("key", …بدائل) — يستبدل {0} {1} بما يُمرَّر */
function t(k, ...args) {
  const row = L[k];
  let s = row ? (row[lang === "en" ? 1 : 0] ?? row[0]) : k;
  args.forEach((a, i) => { s = s.split("{" + i + "}").join(a); });
  return s;
}

/* عنوان الحقل ووحدته حسب اللغة — العربية من المخطَّط، والإنجليزية أسماء أعمدة الإكسل */
const flabel = f => (lang === "en" ? f.xl : f.ar);
const funit  = f => (lang === "en" ? f.unitEn : f.unit);
const pct    = n => (lang === "en" ? n + "%" : n + "٪");

/* النصوص الثابتة في الصفحة تحمل data-i18n وأخواتها */
function applyStatic() {
  document.title = t("page.title");
  $$("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  $$("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
  $$("[data-i18n-label]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nLabel)); });
}

function setLang(next, redraw) {
  lang = LANGS.includes(next) ? next : "ar";
  try { localStorage.setItem("hr-lang", lang); } catch {}
  const root = document.documentElement;
  root.lang = lang;
  root.dir = lang === "ar" ? "rtl" : "ltr";
  root.setAttribute("data-lang", lang);
  nf = new Intl.NumberFormat(lang === "en" ? "en-US" : "ar-SA-u-nu-latn");
  applyStatic();
  if (redraw) { buildForm(); render(); }
}

/* ═════════════════════════════════════════════════════════════════
   6 · كتابة ملف إكسل — ورقة بيانات + ورقة بحث بصيغ XLOOKUP
   ═════════════════════════════════════════════════════════════════ */
const xe = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const XLNS = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
const HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';

function cellXml(ref, value, { num = false, style = 0, formula = null } = {}) {
  const s = style ? ' s="' + style + '"' : "";
  if (formula) return '<c r="' + ref + '"' + s + '><f>' + xe(formula) + "</f></c>";
  if (value === "" || value == null) return style ? '<c r="' + ref + '"' + s + "/>" : "";
  if (num) return '<c r="' + ref + '"' + s + "><v>" + Number(value) + "</v></c>";
  return '<c r="' + ref + '" t="inlineStr"' + s + '><is><t xml:space="preserve">' + xe(value) + "</t></is></c>";
}

function employeesSheet(rows) {
  const cols = FIELDS.map((f, i) =>
    '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + (f.metric ? 11 : f.k === "name" ? 26 : f.k === "email" ? 28 : 17) + '" customWidth="1"/>').join("");
  const head = '<row r="1" ht="22" customHeight="1">' +
    FIELDS.map((f, i) => cellXml(colRef(i) + "1", f.xl, { style: 1 })).join("") + "</row>";
  const body = rows.map((rec, r) =>
    '<row r="' + (r + 2) + '">' +
    FIELDS.map((f, i) => cellXml(colRef(i) + (r + 2), rec[f.k], { num: f.t === "int" })).join("") +
    "</row>").join("");
  return HEAD + "<worksheet " + XLNS + '><sheetViews><sheetView rightToLeft="0" workbookViewId="0">' +
    '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="15"/><cols>' + cols + "</cols><sheetData>" + head + body + "</sheetData>" +
    '<autoFilter ref="A1:' + colRef(FIELDS.length - 1) + Math.max(1, rows.length + 1) + '"/></worksheet>';
}

/* الورقة الثانية تعيد بناء لوحة البحث الأصلية: رقم في C4 وبقية الخانات
   صيغ XLOOKUP تقرأ من ورقة Employees. */
function dashboardSheet() {
  const rows = [];
  rows.push('<row r="2" ht="26" customHeight="1">' + cellXml("B2", "Employee HR Dashboard", { style: 2 }) + "</row>");
  rows.push('<row r="4">' + cellXml("B4", "Enter Employee ID", { style: 3 }) + cellXml("C4", "", { style: 4 }) +
            cellXml("E4", "Photo", { style: 3 }) + "</row>");
  rows.push('<row r="5">' + cellXml("E5", "(Place employee photo manually if desired)") + "</row>");
  FIELDS.forEach((f, i) => {
    const r = 6 + i;
    rows.push('<row r="' + r + '">' + cellXml("B" + r, f.xl, { style: 3 }) +
      cellXml("C" + r, null, { style: 4, formula: 'IFERROR(XLOOKUP($C$4,Employees!$A:$A,Employees!$' + colRef(i) + ":$" + colRef(i) + '),"")' }) +
      "</row>");
  });
  return HEAD + "<worksheet " + XLNS + '><sheetViews><sheetView showGridLines="0" workbookViewId="0"/></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="15"/><cols><col min="2" max="2" width="20" customWidth="1"/>' +
    '<col min="3" max="3" width="34" customWidth="1"/><col min="5" max="5" width="34" customWidth="1"/></cols>' +
    "<sheetData>" + rows.join("") + "</sheetData></worksheet>";
}

function buildXlsx(rows) {
  const parts = new Map();
  parts.set("[Content_Types].xml", HEAD + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
  parts.set("_rels/.rels", HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="' + RT + '/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  parts.set("xl/workbook.xml", HEAD + "<workbook " + XLNS + ' xmlns:r="' + RT + '"><sheets>' +
    '<sheet name="Employees" sheetId="1" r:id="rId1"/><sheet name="HR Dashboard" sheetId="2" r:id="rId2"/></sheets>' +
    '<calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>');
  parts.set("xl/_rels/workbook.xml.rels", HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="' + RT + '/worksheet" Target="worksheets/sheet1.xml"/>' +
    '<Relationship Id="rId2" Type="' + RT + '/worksheet" Target="worksheets/sheet2.xml"/>' +
    '<Relationship Id="rId3" Type="' + RT + '/styles" Target="styles.xml"/></Relationships>');
  parts.set("xl/styles.xml", STYLES);
  parts.set("xl/worksheets/sheet1.xml", employeesSheet(rows));
  parts.set("xl/worksheets/sheet2.xml", dashboardSheet());
  return zipWrite(parts, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

function buildCsv(rows) {
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [FIELDS.map(f => f.xl).join(",")];
  for (const r of rows) lines.push(FIELDS.map(f => q(r[f.k])).join(","));
  return new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
}

/* ═════════════════════════════════════════════════════════════════
   7 · الحالة — نموذج واحد يبحث ويضيف، وجدول القاعدة تحته
   ═════════════════════════════════════════════════════════════════ */
const ROWS_PAGE = 200;   /* صفوف تُعرض دفعة واحدة ثم «عرض المزيد» */

const state = {
  rows: [], byId: new Map(),
  crit: {},        /* شروط البحث المأخوذة من خانات النموذج */
  shown: ROWS_PAGE, hit: null, loaded: null, current: null, imp: null,
};

function reindex() { state.byId = new Map(state.rows.map(r => [r.id, r])); }

const score = r => r.absence + r.late + r.violations * 2 + r.warnings * 3;
function verdict(r) {
  const s = score(r);
  if (s === 0) return { t: t("vd.clean"),    tone: "good" };
  if (s <= 3)  return { t: t("vd.minor"),    tone: "warn" };
  if (s <= 7)  return { t: t("vd.follow"),   tone: "serious" };
  return { t: t("vd.critical"), tone: "crit" };
}

/* ═════════════════════════════════════════════════════════════════
   8 · النموذج
   ═════════════════════════════════════════════════════════════════ */
function buildForm() {
  const keep = state.rows.length ? formValues() : null;   /* لا تضيع المُدخَلات عند تبديل اللغة */
  const fld = f => {
    const type = f.t === "int" ? "number" : f.t === "date" ? "date"
               : f.t === "email" ? "email" : f.t === "tel" ? "tel" : "text";
    const list = f.facet ? "dl-" + f.k : null;
    return '<label class="fld' + (f.metric ? " metric" : "") + '">' +
      "<span>" + esc(flabel(f)) + ":" + (f.req ? " <b>*</b>" : "") + "</span>" +
      '<input name="' + f.k + '" type="' + type + '"' +
      (f.t === "int" ? ' min="0" step="1"' : "") +
      (list ? ' list="' + list + '"' : "") + ">" +
      (list ? '<datalist id="' + list + '"></datalist>' : "") + "</label>";
  };
  $("#form").innerHTML =
    FIELDS.filter(f => !f.metric).map(fld).join("") +
    '<div class="fsplit"><span>' + esc(t("form.conduct")) + "</span><i></i></div>" +
    FIELDS.filter(f => f.metric).map(fld).join("");
  if (keep) for (const f of FIELDS) input(f.k).value = keep[f.k] || "";
  refreshLists();
}

/* قوائم الاقتراح تتغذى من القيم الموجودة في القاعدة نفسها */
function refreshLists() {
  for (const f of FIELDS) {
    if (!f.facet) continue;
    const dl = $("#dl-" + f.k);
    if (!dl) continue;
    dl.innerHTML = uniq(state.rows.map(r => r[f.k]).filter(Boolean))
      .sort((a, b) => a.localeCompare(b, "ar"))
      .map(v => '<option value="' + esc(v) + '">').join("");
  }
}

const input = k => $('#form [name="' + k + '"]');
const formValues = () => Object.fromEntries(FIELDS.map(f => [f.k, (input(f.k) || {}).value ? input(f.k).value.trim() : ""]));

function fillForm(rec) {
  for (const f of FIELDS) input(f.k).value = f.t === "int" ? (rec[f.k] || 0) : (rec[f.k] || "");
  state.loaded = rec.id;
  clearInvalid();
  hint(t("h.loaded"), "warn");
}

function clearForm() {
  for (const f of FIELDS) input(f.k).value = "";
  state.loaded = null;
  state.crit = {};
  state.shown = ROWS_PAGE;
  clearInvalid();
  hint("");
  render();
}

const hint = (msg, kind) => { const h = $("#formHint"); h.textContent = msg || ""; h.className = "hint" + (kind ? " " + kind : ""); };
const clearInvalid = () => $$("#form [name]").forEach(i => i.removeAttribute("aria-invalid"));

/* الرقم المكتوب موجود؟ فالإضافة تحديث، ويُقال ذلك قبل الضغط */
function idWatch() {
  const id = input("id").value.trim().replace(/\s/g, "");
  if (!id) { if (!state.loaded) hint(""); return; }
  const hit = state.byId.get(id);
  if (hit) hint(t("h.exists", id, hit.name), "warn");
  else if (!state.loaded) hint("");
}

/* ═════════════════════════════════════════════════════════════════
   9 · البحث وجدول القاعدة
   ═════════════════════════════════════════════════════════════════ */
function matches() {
  const c = state.crit, keys = Object.keys(c);
  let rows = state.rows;
  if (keys.length) rows = rows.filter(r => keys.every(k => {
    if (F[k].t === "int") return Number(r[k]) === Number(c[k]);
    return String(r[k] ?? "").toLowerCase().includes(String(c[k]).toLowerCase());
  }));
  return [...rows].sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), lang === "en" ? "en" : "ar"));
}

const ICON_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M4 6a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 13h6M9 17h4"/></svg>';

function rowHtml(r) {
  const c = hueOf(r.branch);
  const cells = FIELDS.map((f, i) => {
    const v = r[f.k];
    const first = i === 0 ? ' class="mono br" style="--c:' + c + '"' : "";
    if (f.t === "int")
      return '<td class="flagcell' + (v > 0 ? " " + f.tone : " empty") + '">' + (v > 0 ? fmt(v) : "—") + "</td>";
    if (!v) return i === 0 ? "<td" + first + ">—</td>" : '<td class="empty">—</td>';
    if (i === 0) return "<td" + first + ">" + esc(v) + "</td>";
    return "<td" + (f.mono || f.t === "date" ? ' class="mono"' : "") + ">" + esc(v) + "</td>";
  }).join("");
  return '<tr data-id="' + esc(r.id) + '"' + (state.hit === r.id ? ' class="hit"' : "") + ">" + cells +
    '<td><button class="rowfile" data-file="' + esc(r.id) + '" title="' + esc(t("sheet.rowfile")) + '" ' +
    'aria-label="' + esc(t("view.titleOf", r.name || r.id)) + '">' + ICON_FILE + "</button></td></tr>";
}

function tableHtml(rows) {
  const head = "<tr>" + FIELDS.map(f =>
    "<th" + (f.k === "id" ? ' class="key"' : "") + ">" + esc(flabel(f)) +
    "<small>" + esc(lang === "en" ? f.ar : f.xl) + "</small></th>").join("") +
    '<th class="act"></th></tr>';
  return '<div class="tbl"><table class="db"><thead>' + head + "</thead><tbody>" +
    rows.map(rowHtml).join("") + "</tbody></table></div>";
}

function render() {
  const host = $("#results"), count = $("#count");
  refreshLists();

  if (!state.rows.length) {
    count.innerHTML = "";
    host.innerHTML = '<div class="state"><div class="mark-lg">' + ICON_FILE + "</div>" +
      "<h3>" + esc(t("empty.title")) + "</h3><p>" + t("empty.body") + "</p>" +
      '<div class="row">' +
        '<button class="btn primary" data-act="import">' + esc(t("empty.import")) + "</button>" +
        '<button class="btn" data-act="focus">' + esc(t("empty.fill")) + "</button>" +
        '<button class="btn ghost" data-act="seed">' + esc(t("empty.seed")) + "</button>" +
      "</div></div>";
    return;
  }

  const all = matches();
  const keys = Object.keys(state.crit);
  const crit = keys.map(k => esc(flabel(F[k])) + " = <b>" + esc(state.crit[k]) + "</b>").join(" · ");

  if (!all.length) {
    count.innerHTML = t("sheet.crit", crit);
    host.innerHTML = '<div class="state"><h3>' + esc(t("nomatch.title")) + "</h3>" +
      "<p>" + esc(t("nomatch.body")) + "</p>" +
      '<div class="row"><button class="btn" data-act="clear">' + esc(t("nomatch.clear")) + "</button></div></div>";
    return;
  }

  const page = all.slice(0, state.shown);
  const last = state.rows.reduce((m, r) => (r.updatedAt && r.updatedAt > m ? r.updatedAt : m), "");
  count.innerHTML = (keys.length
      ? t("sheet.results", crit, fmt(all.length), fmt(state.rows.length))
      : t("sheet.count", fmt(state.rows.length))) +
    (last ? ' <span class="muted">· ' + t("sheet.updated", esc(last.slice(0, 10))) + "</span>" : "");

  host.innerHTML = tableHtml(page) +
    (all.length > page.length
      ? '<div class="more"><button class="btn" data-act="more">' + esc(t("sheet.more", fmt(all.length - page.length))) + "</button></div>"
      : "") +
    '<p class="dbnote">' + esc(t("sheet.note", DB.store, DB.name)) + "</p>";

  if (state.hit) {
    const tr = $('tr[data-id="' + CSS.escape(state.hit) + '"]');
    if (tr) tr.scrollIntoView({ behavior: "smooth", block: "center" });

/* ═════════════════════════════════════════════════════════════════
   11 · المؤشرات
   ═════════════════════════════════════════════════════════════════ */
function tally(k, limit) {
  const m = new Map();
  for (const r of state.rows) { const v = r[k] || t("dash.unset"); m.set(v, (m.get(v) || 0) + 1); }
  let arr = [...m].map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);
  if (limit && arr.length > limit) {
    const rest = arr.slice(limit - 1).reduce((s, x) => s + x.value, 0);
    arr = arr.slice(0, limit - 1).concat({ label: t("dash.other"), value: rest });
  }
  return arr;
}

/* byEntity: يلوَّن العمود بلون هوية الفرع نفسه المستعمل في الجدول — لا
   بمقدار القيمة، فالطول وحده هو ما يحمل الرقم. */
function barChart(title, cap, items, unit, byEntity) {
  const max = Math.max(1, ...items.map(i => i.value));
  const total = items.reduce((s, i) => s + i.value, 0) || 1;
  const body = items.length ? '<div class="bars">' + items.map(i => {
    const share = Math.round(i.value / total * 100);
    const col = byEntity ? ";background:" + hueOf(i.label) : "";
    return '<div class="bar-row" data-tip="' + esc(i.label) + "|" + esc(t("dash.share", fmt(i.value), unit, share)) + '">' +
      '<span class="lb" title="' + esc(i.label) + '">' + esc(i.label) + "</span>" +
      '<span class="bar-track"><span class="bar-fill" style="width:' + (i.value / max * 100).toFixed(1) + "%" + col + '"></span></span>' +
      '<span class="vl">' + fmt(i.value) + "</span></div>";
  }).join("") + "</div>" : '<p class="chart-empty">' + esc(t("dash.noData")) + "</p>";
  return '<section class="chart"><h3>' + esc(title) + '</h3><p class="cap">' + esc(cap) + "</p>" + body + "</section>";
}

function colChart(title, cap, items, unit) {
  const max = Math.max(1, ...items.map(i => i.value));
  const body = items.length ? '<div class="cols">' + items.map(i =>
      '<div class="col" data-tip="' + esc(i.label) + "|" + fmt(i.value) + " " + esc(unit) + '">' +
      '<span class="cl">' + fmt(i.value) + "</span>" +
      '<span class="fill" style="height:' + Math.max(2, i.value / max * 100) + '%"></span></div>').join("") + "</div>" +
    '<div class="col-labels">' + items.map(i => "<span>" + esc(i.label) + "</span>").join("") + "</div>"
    : '<p class="chart-empty">' + esc(t("dash.noData")) + "</p>";
  return '<section class="chart"><h3>' + esc(title) + '</h3><p class="cap">' + esc(cap) + "</p>" + body + "</section>";
}

function renderDash() {
  const host = $("#dashHost"), rows = state.rows;
  if (!rows.length) { host.innerHTML = '<p class="chart-empty">' + esc(t("dash.empty")) + "</p>"; return; }

  const branches = uniq(rows.map(r => r.branch).filter(Boolean));
  const depts    = uniq(rows.map(r => r.department).filter(Boolean));
  const tenures  = rows.map(r => yearsBetween(r.hireDate)).filter(v => v != null);
  const avgTen   = tenures.length ? tenures.reduce((s, v) => s + v, 0) / tenures.length : null;
  const clean    = rows.filter(r => score(r) === 0).length;
  const emp      = t("dash.unitEmp");

  const kpi = (k, v, s) => '<div class="kpi"><div class="k">' + esc(k) + '</div><div class="v num">' + v + '</div><div class="s">' + esc(s) + "</div></div>";
  const years = (() => {
    const m = new Map();
    for (const r of rows) if (r.hireDate) { const y = r.hireDate.slice(0, 4); m.set(y, (m.get(y) || 0) + 1); }
    return [...m].sort((a, b) => a[0].localeCompare(b[0])).slice(-10).map(([label, value]) => ({ label, value }));
  })();

  host.innerHTML = '<div class="kpis">' +
      kpi(t("dash.total"), fmt(rows.length), t("dash.totalSub")) +
      kpi(t("dash.branches"), fmt(branches.length),
          branches.length ? branches.slice(0, 2).join(" · ") + (branches.length > 2 ? " …" : "") : t("dash.noBranch")) +
      kpi(t("dash.depts"), fmt(depts.length), t("dash.deptsSub")) +
      kpi(t("dash.tenure"), avgTen == null ? "—" : fmt(Math.round(avgTen * 10) / 10), t("dash.tenureSub")) +
      kpi(t("dash.clean"), pct(Math.round(clean / rows.length * 100)), t("dash.cleanSub", fmt(clean))) +
    "</div>" +
    '<div class="tiles" style="margin-bottom:16px">' + METRICS.map(f => {
      const sum = rows.reduce((s, r) => s + r[f.k], 0);
      const affected = rows.filter(r => r[f.k] > 0).length;
      return '<div class="tile t-' + f.tone + '"' + (sum > 0 ? "" : ' style="--tone:var(--line); --tone-ink:var(--ink-3)"') + ">" +
        '<div class="k">' + esc(flabel(f)) + '</div><div class="v num">' + fmt(sum) + "</div>" +
        '<div class="s">' + esc(t("dash.affected", fmt(affected))) + "</div></div>";
    }).join("") + "</div>" +
    '<div class="charts">' +
      barChart(t("dash.byBranch"), t("dash.byBranchC"), tally("branch"), emp, true) +
      barChart(t("dash.byDept"), t("dash.byDeptC"), tally("department", 8), emp) +
      barChart(t("dash.byNat"), t("dash.byNatC"), tally("nationality", 6), emp) +
      colChart(t("dash.byYear"), t("dash.byYearC"), years, t("dash.unitHire")) +
    "</div>";
}

   12 · أزرار النموذج الثلاثة: بحث · إضافة · مسح
   ═════════════════════════════════════════════════════════════════ */
function openModal(id) {
  $(id).hidden = false;
  const f = $(id).querySelector("input:not([type=hidden]), button");
  if (f) setTimeout(() => f.focus(), 30);
}
const closeModal = id => { $(id).hidden = true; };

/* بحث: كل خانة مملوءة شرط، والنص يُطابَق جزئيًا والعدد يُطابَق تمامًا.
   وإن انطبق الشرط على سجل واحد — كالبحث بالرقم الوظيفي — مُلئت خانات
   النموذج ببياناته كاملة، وإلا فالجدول يعرض المطابقين لتختار منهم. */
function doSearch() {
  const v = formValues(), crit = {};
  for (const f of FIELDS) {
    const val = v[f.k];
    if (!val) continue;
    if (f.t === "int" && Number(val) === 0) continue;   /* صفر ليس شرطًا */
    crit[f.k] = val;
  }
  state.crit = crit;
  state.shown = ROWS_PAGE;
  const hits = matches();

  if (!Object.keys(crit).length) { render(); hint(t("h.all")); return; }

  if (hits.length === 1) {
    const r = hits[0];
    fillForm(r);                 /* البيانات تنزل في الخانات لا تحت الصفحة */
    state.current = r.id;
    state.hit = r.id;
    render();
    hint(t("h.filled", r.name || r.id), "warn");
    return;
  }

  render();
  hint(hits.length ? t("h.found", fmt(hits.length)) : t("h.none"), hits.length ? "" : "bad");
  $("#results").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* إضافة: سجل جديد، أو تحديث إن كان الرقم مسجَّلًا */
async function addFromForm() {
  const raw = formValues();
  const exists = state.byId.get(raw.id.replace(/\s/g, ""));
  if (exists) raw.createdAt = exists.createdAt;
  const rec = coerce(raw);
  const errs = validate(rec, { isNew: !exists });
  clearInvalid();
  const keys = Object.keys(errs);
  if (keys.length) {
    keys.forEach(k => input(k).setAttribute("aria-invalid", "true"));
    hint(errs[keys[0]], "bad");
    input(keys[0]).focus();
    toast(t("t.invalid"), "err");
    return;
  }
  await dbPut(rec);
  await reload();
  state.loaded = rec.id;
  state.hit = rec.id;          /* يُبرَز الصف في الجدول ويُمرَّر إليه */
  render();
  hint(exists ? t("h.updated", rec.name) : t("h.added", rec.name), "warn");
  toast(exists ? t("t.updated") : t("t.added"), "ok");
}

async function delCurrent() {
  const id = state.current, r = id && state.byId.get(id);
  if (!r) return;
  if (!confirm(t("c.delete", r.name || id))) return;
  await dbDelete(id);
  state.current = null;
  if (state.loaded === id) { state.loaded = null; state.crit = {}; for (const f of FIELDS) input(f.k).value = ""; hint(""); }
  await reload();
  closeModal("#mView");
  render();
  toast(t("t.deleted"), "ok");
}

async function pickFile(file) {
  const host = $("#mapHost");
  host.innerHTML = '<p class="muted">' + esc(t("imp.reading")) + "</p>";
  $("#btnDoImport").disabled = true;
  try {
    const sheets = await readWorkbook(file);
    /* تُختار الورقة التي تطابق عناوينها المخطَّط أكثر من غيرها */
    let best = null;
    for (const s of sheets) {
      const hr = findHeaderRow(s.grid);
      const headers = (s.grid[hr] || []).map(x => String(x ?? ""));
      const map = guessMap(headers);
      const n = Object.keys(map).length + (key(s.name) === "employees" ? 3 : 0);
      if (!best || n > best.n) best = { sheet: s, hr, headers, map, n };
    }
    if (!best) throw new Error(t("e.nodata"));
    const rows = best.sheet.grid.slice(best.hr + 1).filter(r => r && r.some(c => String(c ?? "").trim() !== ""));
    state.imp = { file: file.name, ...best, rows };
    renderMap();
  } catch (err) {
    host.innerHTML = '<div class="note bad">' + esc(t("imp.failed", err.message || err)) + "</div>";
  }
}

function renderMap() {
  const im = state.imp, host = $("#mapHost");
  const opts = sel => '<option value="">' + esc(t("imp.none")) + "</option>" + im.headers.map((h, i) =>
    '<option value="' + i + '"' + (sel === i ? " selected" : "") + ">" + esc(h || t("imp.col", colRef(i))) + "</option>").join("");
  host.innerHTML =
    '<div class="note">' + t("imp.read", esc(im.sheet.name), esc(im.file), fmt(im.hr + 1), fmt(im.rows.length)) + "</div>" +
    '<p style="font-size:12.5px; color:var(--ink-3); margin:16px 0 6px">' + esc(t("imp.keyNote")) + "</p>" +
    '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:0 22px">' +
    FIELDS.map(f => '<div class="maprow"><span>' + esc(flabel(f)) + (f.req ? ' <b style="color:var(--crit)">*</b>' : "") +
      ' <small class="muted mono">' + esc(lang === "en" ? f.ar : f.xl) + "</small></span>" +
      '<select data-map="' + f.k + '">' + opts(im.map[f.k]) + "</select></div>").join("") + "</div>" +
    (im.rows.length ? '<div class="note" style="margin-top:14px">' + esc(t("imp.first")) + '<b id="mapPrev"></b></div>' : "");
  updatePreview();
  $("#btnDoImport").disabled = im.map.id == null;
}

function updatePreview() {
  const im = state.imp, box = $("#mapPrev");
  if (!box || !im) return;
  const row = im.rows[0] || [];
  const get = k => im.map[k] == null ? "" : row[im.map[k]] ?? "";
  const rec = coerce({ id: get("id"), name: get("name"), branch: get("branch"), department: get("department"), hireDate: get("hireDate") });
  box.textContent = [rec.id || t("imp.noId"), rec.name || t("imp.noName"), rec.branch, rec.department, rec.hireDate]
    .filter(Boolean).join(" · ");
}

async function doImport() {
  const im = state.imp;
  if (!im) return;
  const recs = [], seen = new Set();
  let skipped = 0, updated = 0;
  for (const row of im.rows) {
    const raw = {};
    for (const f of FIELDS) if (im.map[f.k] != null) raw[f.k] = row[im.map[f.k]] ?? "";
    const rec = coerce(raw);
    if (!rec.id || !rec.name) { skipped++; continue; }
    if (state.byId.has(rec.id)) { rec.createdAt = state.byId.get(rec.id).createdAt; updated++; }
    if (seen.has(rec.id)) { const i = recs.findIndex(x => x.id === rec.id); if (i >= 0) recs.splice(i, 1); }
    seen.add(rec.id);
    recs.push(rec);
  }
  if (!recs.length) {
    $("#mapHost").insertAdjacentHTML("beforeend",
      '<div class="note bad" style="margin-top:12px">' + esc(t("imp.nothing")) + "</div>");
    return;
  }
  await dbPutMany(recs);
  await reload();
  closeModal("#mImport");
  state.imp = null; $("#mapHost").innerHTML = "";
  state.crit = {}; state.shown = ROWS_PAGE;
  render();
  const added = recs.length - updated;
  toast(t("t.imported", fmt(recs.length), fmt(added), fmt(updated), skipped ? t("t.skipped", fmt(skipped)) : ""), "ok");
}

   ═════════════════════════════════════════════════════════════════ */
async function reload() { state.rows = await dbAll(); reindex(); }

const focusForm = () => { $(".formcard").scrollIntoView({ behavior: "smooth", block: "start" }); input("id").focus(); };

function loadIntoForm(id) {
  const r = state.byId.get(id);
  if (!r) return;
  fillForm(r);
  $(".formcard").scrollIntoView({ behavior: "smooth", block: "start" });
  toast(t("t.loaded", r.name || id));
}

/* ── السمة ─────────────────────────────────────────────────────── */
const THEMES = ["auto", "light", "dark"];
let themeIdx = 0;
function applyTheme(x) {
  if (x === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", x);
  try { localStorage.setItem("hr-theme", x); } catch {}
}

/* ── تلميح الرسوم ───────────────────────────────────────────────── */
document.addEventListener("mousemove", e => {
  const host = e.target instanceof Element ? e.target.closest("[data-tip]") : null;
  const box = $("#tip");
  if (!host) { box.classList.remove("on"); return; }
  const [label, val] = host.dataset.tip.split("|");
  box.innerHTML = esc(label) + (val ? "<small>" + esc(val) + "</small>" : "");
  box.classList.add("on");
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.min(Math.max(8, e.clientX - w / 2), innerWidth - w - 8) + "px";
  box.style.top  = Math.max(8, e.clientY - h - 12) + "px";
});

function wire() {
  $("#btnSearch").addEventListener("click", doSearch);
  $("#btnAdd").addEventListener("click", addFromForm);
  $("#btnClearForm").addEventListener("click", () => { clearForm(); input("id").focus(); });
  $("#form").addEventListener("submit", e => { e.preventDefault(); doSearch(); });
  $("#form").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doSearch(); } });
  $("#form").addEventListener("input", e => { if (e.target.name === "id") idWatch(); });
  addEventListener("keydown", e => {
    if (e.key === "Escape") $$(".modal:not([hidden])").forEach(m => m.hidden = true);
  });

  $("#results").addEventListener("click", e => {
    const act = e.target.closest("[data-act]");
    if (act) {
      const a = act.dataset.act;
      if (a === "import") openModal("#mImport");
      if (a === "seed") seed();
      if (a === "focus") focusForm();
      if (a === "clear") { clearForm(); focusForm(); }
      if (a === "more") { state.shown += ROWS_PAGE; render(); }
      return;
    }
    const file = e.target.closest("[data-file]");
    if (file) { openView(file.dataset.file); return; }
    const tr = e.target.closest("tr[data-id]");
    if (tr) loadIntoForm(tr.dataset.id);
  });

  $("#dbXlsx").addEventListener("click", exportXlsx);
  $("#dbJson").addEventListener("click", exportJson);
  $("#btnImport").addEventListener("click", () => openModal("#mImport"));
  $("#btnExport").addEventListener("click", () => openModal("#mExport"));
  $("#btnDash").addEventListener("click", () => { renderDash(); openModal("#mDash"); });
  $("#btnEditCur").addEventListener("click", () => {
    if (!state.current) return;
    closeModal("#mView");
    loadIntoForm(state.current);
  });
  $("#btnDelCur").addEventListener("click", delCurrent);
  $("#btnPrint").addEventListener("click", () => print());
  $$("[data-close]").forEach(b => b.addEventListener("click", () => b.closest(".modal").hidden = true));

  $("#drop").addEventListener("click", () => $("#file").click());
  $("#drop").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#file").click(); } });
  $("#file").addEventListener("change", e => { if (e.target.files[0]) pickFile(e.target.files[0]); e.target.value = ""; });
  ["dragenter", "dragover"].forEach(ev => $("#drop").addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => $("#drop").addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.remove("over"); }));
  $("#drop").addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) pickFile(f); });
  $("#mapHost").addEventListener("change", e => {
    const s = e.target.closest("[data-map]");
    if (!s || !state.imp) return;
    const k = s.dataset.map;
    if (s.value === "") delete state.imp.map[k]; else state.imp.map[k] = +s.value;
    $("#btnDoImport").disabled = state.imp.map.id == null;
    updatePreview();
  });
  $("#btnDoImport").addEventListener("click", doImport);

  $("#expXlsx").addEventListener("click", exportXlsx);
  $("#expCsv").addEventListener("click", exportCsv);
  $("#expJson").addEventListener("click", exportJson);
  $("#btnSeed").addEventListener("click", () => { closeModal("#mExport"); seed(); });
  $("#btnWipe").addEventListener("click", wipe);

  try { themeIdx = Math.max(0, THEMES.indexOf(localStorage.getItem("hr-theme") || "auto")); } catch {}
  applyTheme(THEMES[themeIdx]);
  $("#btnTheme").addEventListener("click", () => { themeIdx = (themeIdx + 1) % THEMES.length; applyTheme(THEMES[themeIdx]); });

  /* اللغة: عربي ⇄ English — تنقلب الواجهة كلها واتجاهها */
  $("#btnLang").addEventListener("click", () => {
    setLang(lang === "ar" ? "en" : "ar", true);
    if (!$("#mDash").hidden) renderDash();
    if (!$("#mView").hidden && state.current) openView(state.current);
    if (state.imp) renderMap();
  });
}

/* ═════════════════════════════════════════════════════════════════
   17 · الإقلاع
   ═════════════════════════════════════════════════════════════════ */
(async () => {
  let saved = "ar";
  try { saved = localStorage.getItem("hr-lang") || "ar"; } catch {}
  setLang(saved, false);
  buildForm();
  wire();
  if (!("DecompressionStream" in window)) toast(t("t.oldBrowser"), "err");
  try {
    db = await openDB();
    await reload();
  } catch (e) {
    toast(t("t.dbFail", e.message || e), "err");
  }
  render();
  input("id").focus();
})();

})();
</script>
</body>
</html>
