<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم — نسيج</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1a17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b1a17'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' fill='%23a98b4b' text-anchor='middle'%3E%D9%86%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<!-- ------------------------------------------------------------ الدخول -->
<div id="gate" class="wrap" style="max-width:420px;padding-top:12vh">
  <div class="panel" style="text-align:center">
    <span class="brand-mark" style="margin:0 auto 12px;width:44px;height:44px;font-size:22px;border-radius:13px">ن</span>
    <h1 style="font-size:19px">لوحة تحكم نسيج</h1>
    <p class="note" style="margin:6px 0 16px">إدارة المنتجات والطلبات والمخزون</p>
    <div class="field" style="text-align:start">
      <label>رمز الدخول</label>
      <input id="gatePass" type="password" inputmode="numeric" placeholder="••••" autocomplete="current-password">
      <div class="err" id="gateErr" hidden>رمز غير صحيح</div>
    </div>
    <button class="btn btn-gold btn-wide" id="gateBtn" style="margin-top:12px">دخول</button>
    <p class="note" style="margin-top:14px">نسخة تجريبية — الرمز الافتراضي <b>1234</b>. هذه بوابة عرض فقط ولا تحمي البيانات؛ في النسخة الحقيقية يتولّى الخادم تسجيل الدخول والصلاحيات.</p>
    <p style="margin-top:12px"><a class="btn btn-quiet btn-sm" href="index.html">← عودة للمتجر</a></p>
  </div>
</div>

<!-- ------------------------------------------------------------ اللوحة -->
<div class="adm" id="adm" hidden>
  <aside class="adm-side">
    <a class="brand" href="index.html">
      <span class="brand-mark">ن</span>
      <span style="color:#fff">نسيج<span class="brand-sub" style="color:#9b958a">لوحة التحكم</span></span>
    </a>
    <nav class="adm-nav" id="admNav"></nav>
  </aside>

  <main class="adm-main">
    <div class="wrap" id="admView"></div>
  </main>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modalTitle">—</h2>
      <button class="icon-btn no-print" id="modalClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="assets/data.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
