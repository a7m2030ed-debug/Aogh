name: فحص قنوات كورة تايم

on:
  workflow_dispatch:
  schedule:
    # كل اثنين فجراً: العناوين المفتوحة تتغيّر، فنعيد الجلب والفحص
    - cron: "0 3 * * 1"
  push:
    branches: [claude/kora-time-ios-app-q9dalt]
    paths:
      - "KoraTime/Tools/channels-candidates.json"
      - ".github/scripts/verify_channels.py"
      - ".github/scripts/discover_channels.py"
      - ".github/workflows/channels.yml"

concurrency:
  group: channels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: جلب العناوين وفحص البثّ
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: التحقّق من وجود ملف المرشّحين
        id: guard
        run: |
          if [ -f KoraTime/Tools/channels-candidates.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "لا يوجد ملف مرشّحين على هذا الفرع — تخطّي."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: جلب العناوين الحالية من الفهرس المفتوح
        if: steps.guard.outputs.ready == 'true'
        run: |
          python3 .github/scripts/discover_channels.py \
            --manual KoraTime/Tools/channels-candidates.json \
            --output merged-candidates.json

      - name: فحص كل رابط وبناء القائمة
        if: steps.guard.outputs.ready == 'true'
        run: |
          python3 .github/scripts/verify_channels.py \
            --candidates merged-candidates.json \
            --output KoraTime/KoraTime/Resources/channels.json \
            --report channel-report.md

      - name: عرض التقرير
        if: steps.guard.outputs.ready == 'true'
        run: cat channel-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: رفع التقرير كملف
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: channel-report
          path: channel-report.md
          retention-days: 30

      - name: حفظ القائمة المحدّثة
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KoraTime/KoraTime/Resources/channels.json
          if git diff --cached --quiet; then
            echo "القائمة لم تتغيّر."
            exit 0
          fi
          git commit -m "تحديث قائمة القنوات بعد فحص الروابط"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
