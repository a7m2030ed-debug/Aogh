name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/excel-data-form-template-lz5rmp]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must be switched on once by hand:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # GitHub refuses to let GITHUB_TOKEN create the Pages site itself
      # ("Resource not accessible by integration"), so enablement:true
      # cannot replace that one-time step.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
