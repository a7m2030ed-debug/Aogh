# بديل اختياري: لمن يفضّل توليد المشروع بـ XcodeGen بدل الملف الجاهز.
#   brew install xcodegen && xcodegen generate
# الملف KoraTime.xcodeproj مرفوع جاهزاً، فلا حاجة لهذا إلا عند تغيير بنية المشروع.

name: KoraTime
options:
  bundleIdPrefix: com.koratime
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  KoraTime:
    type: application
    platform: iOS
    sources:
      - path: KoraTime
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koratime.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: KoraTime/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
